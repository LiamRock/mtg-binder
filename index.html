<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1b1e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Pocket Binder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="mana/mana.css">
<style>
:root{
  --bg:#f2f2f0; --surface:#ffffff; --raise:#ebebe8; --ink:#17171a; --muted:#6b6b73; --line:#dcdcd7;
  --accent:#c47a00; --accent-ink:#ffffff; --accent-soft:rgba(196,122,0,.15);
  --good:#1d7a4a; --warn:#b25a00; --bad:#b3261e;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0f11; --surface:#1b1b1e; --raise:#27272b; --ink:#ececef; --muted:#9b9ba4; --line:#2d2d32;
  --accent:#f5a31a; --accent-ink:#1a1100; --accent-soft:rgba(245,163,26,.17);
  --good:#62d49a; --warn:#f0b36a; --bad:#ff8c84; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:24px;height:24px;display:block;flex:none}

/* top bar */
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left))}
.hrow{display:flex;align-items:center;gap:6px;min-height:58px}
.hbtn{width:44px;height:44px;border:0;border-radius:50%;background:none;display:grid;place-items:center}
.hbtn:active{background:var(--raise)}
.htitle{flex:1;min-width:0;padding:0 8px}
.htitle h1{margin:0;font:700 19px/1.2 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsub{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;line-height:1.3}
.center .htitle{text-align:center}.center .hsub{justify-content:center}
#status{font-size:12px;color:var(--muted);text-align:right;max-width:42%;padding-right:8px}
.tabs{display:flex}
.tabs button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

.app{max-width:760px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left)) calc(92px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}
h2{font:700 18px/1.25 var(--sans);margin:18px 0 8px}
h3{font:700 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:22px 0 8px}
p{margin:6px 0}
.sub{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}

/* mana & type icons */
.mc{display:inline-flex;align-items:center;gap:2px;font-size:15px;vertical-align:middle}
.mc.lg{font-size:19px}
.mc .ms-cost{margin:0}
.oracle .ms-cost{font-size:.9em;vertical-align:-.15em;margin:0 1px}
.ty{color:var(--muted);font-size:15px}

/* rows */
.row,.deckrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.art{width:66px;height:48px;object-fit:cover;border-radius:8px;background:var(--raise);flex:none;display:block}
.rmain{flex:1;min-width:0}
.rmain b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.line{display:flex;align-items:center;gap:8px;min-height:20px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--raise);border-radius:999px;padding:2px;flex:none}
.qty button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;font-size:19px;line-height:1}
.qty button:active{background:var(--line)}
.qty span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.sec{display:flex;align-items:center;gap:10px;background:var(--raise);margin:16px calc(-1 * max(14px,env(safe-area-inset-left))) 0;padding:10px max(14px,env(safe-area-inset-left));font-weight:700;letter-spacing:.05em;font-size:13px;text-transform:uppercase}
.sec .ms{font-size:18px;color:var(--muted)}
.sec .cnt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.sec button{border:0;background:none;color:var(--accent);padding:0 0 0 8px;display:grid;place-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 16px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input[type=search],input[type=text],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
textarea{padding:10px 14px;min-height:150px;resize:vertical}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:48px;color:var(--muted);width:100%;text-align:left}
.searchbox input{border:0;background:none;padding:0;min-height:44px;flex:1;outline:0}
.searchbox:focus-within{border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface);font-size:13.5px;font-weight:600}
.chip[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px;margin-top:12px}
.tile{position:relative}
.tile .open{display:block;width:100%;background:none;border:0;padding:0;text-align:left}
.tile img{width:100%;aspect-ratio:488/680;object-fit:cover;border-radius:8px;background:var(--raise);display:block}
.tile .t{margin-top:5px;font-size:13px;line-height:1.25}
.tile .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .add{position:absolute;right:6px;top:6px;width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 1px 5px #0007}
.tile .own{position:absolute;left:6px;top:6px;background:var(--good);color:#04150d;border-radius:999px;font-size:12px;font-weight:700;padding:2px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
.stat b{display:block;font:700 21px/1.15 var(--sans);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.banner{background:var(--accent-soft);border-radius:12px;padding:8px 12px;margin-top:12px;display:flex;align-items:center;gap:10px}
.banner span{flex:1}
.curve{display:flex;align-items:flex-end;gap:7px;height:130px;margin:10px 0 4px;padding-top:6px}
.curve div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--muted);gap:3px}
.curve i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px}
.curve b{color:var(--ink);font-weight:700;font-size:12.5px}
.hb{display:flex;align-items:center;gap:12px;padding:7px 0}
.hb .ms{width:24px;text-align:center;font-size:19px;flex:none}
.hb .bg{flex:1;height:10px;background:var(--raise);border-radius:5px;overflow:hidden}
.hb .bg i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hb .n{min-width:30px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.hb .lbl{width:96px;flex:none}
.need{color:var(--warn);font-size:12.5px;font-weight:600}
.empty{color:var(--muted);padding:30px 4px;text-align:center}
.err{color:var(--bad);padding:10px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--muted)}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 max(0px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(0px,env(safe-area-inset-left))}
nav button{flex:1;border:0;background:none;padding:8px 0 8px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
nav button.on{color:var(--accent)}
nav button.on .pill{background:var(--accent-soft)}

dialog{border:0;padding:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;margin:auto auto 0;max-height:94vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:#000a}
.sheet{padding:14px max(16px,env(safe-area-inset-left)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.sheet .big{width:min(260px,70%);aspect-ratio:488/680;border-radius:13px;display:block;margin:6px auto 12px;background:var(--raise)}
.sheet h2{margin-top:4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.oracle{white-space:pre-line}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;width:min(100%,46vh);margin:12px auto 0}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;left:50%;top:50%;height:88%;aspect-ratio:5/7;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.5);pointer-events:none}
.gname{position:absolute;left:5%;width:72%;top:3.5%;height:8%;border:2px solid #f5a31a;border-radius:6px}
.camoff{position:absolute;inset:0;display:grid;place-items:center;color:#cfcfd4;text-align:center;padding:24px;font-size:14px}
.scanres{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:6px}
.scanres .thumb{width:84px;aspect-ratio:488/680;border-radius:6px;background:var(--raise);flex:none;display:block;border:0;padding:0}
.scanres .thumb img{width:100%;height:100%;border-radius:6px;display:block}
.pts{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px}
.pt{flex:none;width:92px;background:none;border:2px solid transparent;border-radius:10px;padding:3px;text-align:left;font-size:12px;line-height:1.25}
.pt img{width:100%;aspect-ratio:488/680;border-radius:6px;display:block;background:var(--raise)}
.pt.on{border-color:var(--accent)}
.sug{margin:-2px 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sug:empty{display:none}
.sug button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:0 14px;min-height:46px;font-size:15px}
.sug button:last-child{border-bottom:0}
.sug button:active{background:var(--raise)}
.sug b{color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.foot{margin-top:28px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="hdr"></header>
<div class="app"><main id="view"></main></div>
<nav id="nav" aria-label="Sections"></nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/*PURE-START*/
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){row.push(f);f='';}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f);f=''; if(row.length>1||row[0]!=='') rows.push(row); row=[]; }
    else f+=ch;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function csvToRows(text){
  const rows=parseCSV(text.replace(/^﻿/,'')); if(rows.length<2) return [];
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=(...names)=>{for(const n of names){const i=h.indexOf(n);if(i>=0)return i;}return -1;};
  const iName=col('name','card name'),iSet=col('set code','set','edition code'),iCn=col('collector number','collector_number','number'),
        iFoil=col('foil'),iQty=col('quantity','qty','count'),iId=col('scryfall id','scryfall_id');
  const get=(r,i)=>i<0?'':String(r[i]??'').trim();
  return rows.slice(1).map(r=>({
    name:get(r,iName), set:get(r,iSet).toLowerCase(), cn:get(r,iCn), id:get(r,iId).toLowerCase(),
    foil:/^(foil|etched|true|yes|1)$/i.test(get(r,iFoil)), qty:parseInt(get(r,iQty)||'1',10)||1
  })).filter(r=>r.id||r.name);
}
function planImport(rows){
  const map=new Map(),idents=[];
  for(const r of rows){
    const key=r.id?'id:'+r.id:(r.set&&r.cn)?'sc:'+r.set+'/'+r.cn:'n:'+r.name.toLowerCase();
    let e=map.get(key);
    if(!e){e={qty:0,foil:0,used:false,ident:r.id?{id:r.id}:(r.set&&r.cn)?{set:r.set,collector_number:r.cn}:{name:r.name}};map.set(key,e);idents.push(e.ident);}
    if(r.foil) e.foil+=r.qty; else e.qty+=r.qty;
  }
  return {map,idents};
}
function cardKeys(c){return ['id:'+c.id,'sc:'+c.set+'/'+c.collector_number,'n:'+String(c.name).toLowerCase()];}
function parseDecklist(text){
  const out=[];let board='main';
  for(const raw of text.split(/\r?\n/)){
    let line=raw.trim(); if(!line||line.startsWith('//')||line.startsWith('#')) continue;
    const hm=line.match(/^\[(.+)\]$/);
    if(hm){const n=hm[1].trim().toLowerCase();board=(n==='commander'||n==='commanders')?'commander':n==='sideboard'?'side':(n==='maybeboard'||n==='considering')?'skip':'main';continue;}
    const h=line.replace(/:$/,'').toLowerCase();
    if(h==='sideboard'||h==='sb'){board='side';continue;}
    if(h==='commander'||h==='commanders'){board='commander';continue;}
    if(h==='deck'||h==='main'||h==='mainboard'){board='main';continue;}
    if(h==='maybeboard'||h==='considering'){board='skip';continue;}
    let b=board; if(/^sb:\s*/i.test(line)){line=line.replace(/^sb:\s*/i,'');b='side';}
    if(b==='skip') continue;
    const m=line.match(/^(\d+)\s*x?\s+(.+?)(?:\s+\(([A-Za-z0-9]{2,6})\)(?:\s+([\w\-★]+))?)?\s*(?:\*[A-Za-z]+\*)?$/);
    if(!m) continue;
    out.push({qty:+m[1],name:m[2].trim(),set:m[3]?m[3].toLowerCase():'',cn:m[4]||'',board:b});
  }
  return out;
}
/*PURE-END*/

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- icons ---------- */
const svg=p=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={
  back:svg('<path d="M15 5l-7 7 7 7"/>'),
  plus:svg('<path d="M12 5v14M5 12h14"/>'),
  search:svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  coll:svg('<rect x="3" y="4" width="18" height="6" rx="1.5"/><path d="M5 10v8a2 2 0 002 2h10a2 2 0 002-2v-8M10 14h4"/>'),
  decks:svg('<rect x="3.5" y="6" width="11" height="15" rx="2"/><path d="M8 3h9a3 3 0 013 3v11"/>'),
  data:svg('<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'),
  chart:svg('<path d="M5 20V11M12 20V4M19 20v-6"/>'),
  info:svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>'),
  scan:svg('<path d="M4 8a2 2 0 012-2h2l1.5-2h5L16 6h2a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><circle cx="12" cy="12.5" r="3.5"/>')
};
const NAV=[['search','Search',IC.search],['coll','Collection',IC.coll],['decks','Decks',IC.decks],['scan','Scan',IC.scan],['sync','Data',IC.data]];
function sym(code){const c=code.toLowerCase().replace(/\//g,'');const a={t:'tap',q:'untap'};const k=a[c]||c;
  return /^[a-z0-9]+$/.test(k)?`<i class="ms ms-${k} ms-cost ms-shadow" title="{${esc(code)}}"></i>`:`{${esc(code)}}`;}
const manaIcons=s=>String(s||'').replace(/\{([^}]+)\}/g,(m,c)=>sym(c));
const costHTML=(s,lg)=>s?`<span class="mc${lg?' lg':''}">${manaIcons(esc(s))}</span>`:'';
const TYPES=['Creature','Planeswalker','Battle','Instant','Sorcery','Artifact','Enchantment','Land'];
const TYPE_ICON={Creature:'creature',Planeswalker:'planeswalker',Battle:'battle',Instant:'instant',Sorcery:'sorcery',Artifact:'artifact',Enchantment:'enchantment',Land:'land'};
function typeGroup(t){if(/Land/.test(t))return 'Land';return TYPES.find(x=>t.includes(x))||'Other';}
const PLURAL={Creature:'Creatures',Planeswalker:'Planeswalkers',Battle:'Battles',Instant:'Instants',Sorcery:'Sorceries',Artifact:'Artifacts',Enchantment:'Enchantments',Land:'Lands',Other:'Other'};
const typeIcon=g=>TYPE_ICON[g]?`<i class="ms ms-${TYPE_ICON[g]} ty" title="${g}"></i>`:'';
const ciIcons=a=>`<span class="mc">${(a&&a.length?a:['C']).map(l=>`<i class="ms ms-${l.toLowerCase()} ms-cost ms-shadow"></i>`).join('')}</span>`;

/* ---------- storage ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('pocket-binder',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('cards',{keyPath:'id'});d.createObjectStore('collection',{keyPath:'id'});d.createObjectStore('decks',{keyPath:'id'});d.createObjectStore('meta');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const idb={
  all:s=>new Promise((res,rej)=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}),
  get:(s,k)=>new Promise((res,rej)=>{const q=db.transaction(s).objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}),
  put:(s,v,k)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');k===undefined?t.objectStore(s).put(v):t.objectStore(s).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}),
  putMany:(s,vs)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');const o=t.objectStore(s);vs.forEach(v=>o.put(v));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}),
  del:(s,k)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}),
  clear:s=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=()=>res();t.onerror=()=>rej(t.error);})
};

const S={cards:new Map(),coll:new Map(),decks:[],lastRefresh:0,tab:'search',deckId:null,dtab:'cards',target:null,busy:false,collQ:'',collSort:'name',collLimit:100,
  search:{q:'',prints:false,results:[],next:null,total:0,loading:false,err:'',empty:false,seq:0},
  scan:{stream:null,workerP:null,busy:false,auto:false,card:null,cands:[],prints:null,printsBusy:false,msg:'',log:[]}};

/* ---------- cards & prices ---------- */
const CARD_V=2;
function faceImg(c,k){const u=c.image_uris||(c.card_faces&&c.card_faces[0]&&c.card_faces[0].image_uris)||{};return u[k]||'';}
function slim(c){
  const f=c.card_faces||[];const p=c.prices||{};
  return {v:CARD_V,id:c.id,name:c.name,set:c.set,set_name:c.set_name,cn:c.collector_number,rarity:c.rarity,
    mana:c.mana_cost||f.map(x=>x.mana_cost).filter(Boolean).join(' // '),cmc:c.cmc||0,type:c.type_line||'',ci:c.color_identity||[],
    text:c.oracle_text||f.map(x=>x.oracle_text).filter(Boolean).join('\n//\n'),
    img:faceImg(c,'small'),imgL:faceImg(c,'normal'),art:faceImg(c,'art_crop'),
    prices:{usd:p.usd,usd_foil:p.usd_foil,usd_etched:p.usd_etched},uri:c.scryfall_uri,upd:Date.now()};
}
function remember(list,persist){const s=list.map(slim);s.forEach(c=>S.cards.set(c.id,c));if(persist)idb.putMany('cards',s);return s;}
const num=v=>v==null||v===''?null:parseFloat(v);
function unitPrice(c,foil){const p=c.prices||{};return foil?(num(p.usd_foil)??num(p.usd_etched)??num(p.usd)):(num(p.usd)??num(p.usd_foil)??num(p.usd_etched));}
const money=n=>n==null?'—':'$'+n.toFixed(2);
function entryValue(e){const c=S.cards.get(e.id);if(!c)return 0;return (e.qty||0)*(unitPrice(c,false)||0)+(e.foil||0)*(unitPrice(c,true)||0);}
const owned=id=>{const e=S.coll.get(id);return e?(e.qty||0)+(e.foil||0):0;};
function ownedByName(){const m=new Map();for(const e of S.coll.values()){const c=S.cards.get(e.id);if(c)m.set(c.name,(m.get(c.name)||0)+e.qty+e.foil);}return m;}
const art=c=>`<img class="art" src="${esc(c.art||c.img)}" alt="" loading="lazy">`;

/* ---------- Scryfall ---------- */
let lastCall=0;
async function sf(path,opt={}){
  const wait=Math.max(0,lastCall+110-Date.now());lastCall=Date.now()+wait;if(wait)await sleep(wait);
  const url=path.startsWith('http')?path:'https://api.scryfall.com'+path;
  const headers={Accept:'application/json;q=0.9,*/*;q=0.8'};if(opt.body)headers['Content-Type']='application/json';
  for(let i=0;i<2;i++){
    const r=await fetch(url,{...opt,headers});
    if(r.status===429&&i===0){await sleep(2500);continue;}
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const e=new Error(j.details||('Scryfall error '+r.status));e.status=r.status;throw e;}
    return j;
  }
}
async function fetchCollection(idents,onProgress){
  const found=[],missing=[];
  for(let i=0;i<idents.length;i+=75){
    const j=await sf('/cards/collection',{method:'POST',body:JSON.stringify({identifiers:idents.slice(i,i+75)})});
    found.push(...j.data);missing.push(...(j.not_found||[]));
    if(onProgress)onProgress(Math.min(i+75,idents.length),idents.length);
  }
  return {found,missing};
}
function statusIdle(){
  if(!S.lastRefresh)return 'Prices not yet updated';
  const h=Math.round((Date.now()-S.lastRefresh)/36e5);
  return 'Prices updated '+(h<1?'just now':h<48?h+'h ago':Math.round(h/24)+'d ago');
}
function setStatus(t){const el=$('#status');if(el)el.textContent=t||statusIdle();}
const referencedIds=()=>[...new Set([...S.coll.keys(),...S.decks.flatMap(d=>d.cards.map(c=>c.id))])];
async function refreshAll(auto){
  if(S.busy)return;
  const ids=referencedIds();
  if(!ids.length){if(!auto)toast('Nothing to update yet');return;}
  S.busy=true;
  try{
    const {found}=await fetchCollection(ids.map(id=>({id})),(a,b)=>setStatus('Updating '+a+' of '+b+'…'));
    remember(found,true);
    S.lastRefresh=Date.now();await idb.put('meta',S.lastRefresh,'lastRefresh');
    if(!auto)toast('Updated '+found.length+' cards');
  }catch(e){if(!auto)toast('Could not reach Scryfall. Try again online.');}
  finally{S.busy=false;setStatus();refreshView();}
}

/* ---------- mutations ---------- */
function persistCard(id){const c=S.cards.get(id);if(c)idb.put('cards',c);}
function collAdd(id,foil,delta){
  const e=S.coll.get(id)||{id,qty:0,foil:0};
  if(foil)e.foil=Math.max(0,e.foil+delta);else e.qty=Math.max(0,e.qty+delta);
  if(e.qty+e.foil===0){S.coll.delete(id);idb.del('collection',id);}else{S.coll.set(id,e);idb.put('collection',e);persistCard(id);}
}
const saveDeck=d=>{d.updated=Date.now();return idb.put('decks',d);};
function deckAdd(d,id,board,delta){
  let e=d.cards.find(x=>x.id===id&&x.board===board);
  if(!e){if(delta<=0)return;e={id,qty:0,board};d.cards.push(e);}
  e.qty+=delta;if(e.qty<=0)d.cards=d.cards.filter(x=>x!==e);
  persistCard(id);saveDeck(d);
}
const deckById=id=>S.decks.find(d=>d.id===id);

/* ---------- ui helpers ---------- */
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2400);}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};

function pushNav(){navIdx++;try{history.pushState(snap(),'');}catch(e){}}

/* search */
function renderSearch(){
  setHeader({title:'Search'});
  const s=S.search,d=S.target&&deckById(S.target);
  $('#view').innerHTML=`
    ${d?`<div class="banner"><span>Adding to <b>${esc(d.name)}</b></span><button class="btn small" data-a="opendeck" data-id="${d.id}">Open deck</button><button class="btn small" data-a="cleartarget">Done</button></div>`:''}
    <div class="bar"><label class="searchbox">${IC.search}<input id="q" type="search" placeholder="Search cards, e.g. t:goblin c:r cmc<=2" enterkeyhint="search" autocomplete="off" value="${esc(s.q)}"></label></div>
    <div class="bar"><button class="chip" data-a="prints" aria-pressed="${s.prints}">All printings</button><span class="sub">Scryfall search syntax works</span></div>
    <div id="results"></div>`;
  renderResults();
}
function renderResults(){
  const el=$('#results');if(!el)return;const s=S.search;
  if(s.err){el.innerHTML=`<p class="err">${esc(s.err)}</p>`;return;}
  if(!s.results.length){el.innerHTML=s.loading?'<p class="empty">Searching…</p>':s.empty?'<p class="empty">No cards matched that search.</p>':'<p class="empty">Search by name or use Scryfall syntax.<br>Tap + on a card to add it fast, or tap the card for details.</p>';return;}
  const quickLabel=S.target?'Add to deck':'Add to collection';
  el.innerHTML=`<p class="sub">${s.total} card${s.total===1?'':'s'} found</p><div class="grid">`+s.results.map(c=>{
    const n=owned(c.id);
    return `<div class="tile"><button class="open" data-a="card" data-id="${c.id}"><img src="${esc(c.img)}" alt="" loading="lazy"><div class="t"><b>${esc(c.name)}</b><span class="sub">${esc(c.set.toUpperCase())} #${esc(c.cn)} · ${money(unitPrice(c,false))}</span></div></button>${n?`<span class="own">${n}</span>`:''}<button class="add" data-a="quick" data-id="${c.id}" aria-label="${quickLabel}: ${esc(c.name)}">${IC.plus}</button></div>`;
  }).join('')+'</div>'+(s.next?`<div class="bar"><button class="btn" data-a="more" ${s.loading?'disabled':''}>${s.loading?'Loading…':'Load more'}</button></div>`:'');
}
async function runSearch(more){
  const s=S.search,q=s.q.trim();if(!more&&!q){s.results=[];s.empty=false;s.err='';renderResults();return;}
  const seq=++s.seq;s.loading=true;s.err='';s.empty=false;renderResults();
  try{
    const j=more?await sf(s.next):await sf(`/cards/search?q=${encodeURIComponent(q)}&unique=${s.prints?'prints':'cards'}&order=name`);
    if(seq!==s.seq)return;
    const cs=remember(j.data,false);
    s.results=more?s.results.concat(cs):cs;s.total=j.total_cards||s.results.length;s.next=j.has_more?j.next_page:null;
  }catch(e){
    if(seq!==s.seq)return;
    if(e.status===404){if(!more){s.results=[];s.total=0;s.next=null;}s.empty=!more;}
    else s.err=navigator.onLine?e.message:'No connection. Search needs the internet; your collection and decks still work offline.';
  }finally{if(seq===s.seq){s.loading=false;renderResults();}}
}

/* collection */
function renderColl(){
  setHeader({title:'Collection'});
  $('#view').innerHTML=`
    <div class="stats" id="cstats"></div>

function renderCollList(){
  const el=$('#clist');if(!el)return;
  let items=[...S.coll.values()].map(e=>({e,c:S.cards.get(e.id)})).filter(x=>x.c);
  let totalCards=0,value=0;for(const x of items){totalCards+=x.e.qty+x.e.foil;value+=entryValue(x.e);}
  $('#cstats').innerHTML=`<div class="stat"><b>${items.length}</b><span>Unique</span></div><div class="stat"><b>${totalCards}</b><span>Cards</span></div><div class="stat"><b>${money(value)}</b><span>Value</span></div>`;
  const q=S.collQ.trim().toLowerCase();if(q)items=items.filter(x=>x.c.name.toLowerCase().includes(q)||x.c.set_name.toLowerCase().includes(q)||x.c.type.toLowerCase().includes(q));
  const sorters={name:(a,b)=>a.c.name.localeCompare(b.c.name),value:(a,b)=>entryValue(b.e)-entryValue(a.e),qty:(a,b)=>(b.e.qty+b.e.foil)-(a.e.qty+a.e.foil)};
  items.sort(sorters[S.collSort]||sorters.name);
  if(!items.length){el.innerHTML=`<p class="empty">${S.coll.size?'Nothing matches that filter.':'Your collection is empty.<br>Add cards from Search, or import a ManaBox CSV in the Data tab.'}</p>`;return;}
  const shown=items.slice(0,S.collLimit);
  el.innerHTML=shown.map(({e,c})=>`<div class="row" data-a="card" data-id="${c.id}">${art(c)}<div class="rmain"><b>${esc(c.name)}</b><div class="line">${typeIcon(typeGroup(c.type))}${costHTML(c.mana)}<span class="sub">${esc(c.set.toUpperCase())} #${esc(c.cn)} · ${money(entryValue(e))}${e.foil?` · ${e.foil} foil`:''}</span></div></div>
    <div class="qty" data-stop><button data-a="dec" data-id="${c.id}" aria-label="Remove one">−</button><span>${e.qty+e.foil}</span><button data-a="inc" data-id="${c.id}" aria-label="Add one">+</button></div></div>`).join('')
    +(items.length>shown.length?`<div class="bar"><button class="btn" data-a="showmore">Show more (${items.length-shown.length} left)</button></div>`:'');
}

/* decks */
const FORMATS=['Commander','Standard','Modern','Pioneer','Legacy','Pauper','Limited','Other'];
function renderDecks(){S.deckId&&deckById(S.deckId)?renderDeck():renderDeckList();}
function deckStats(d){let n=0,val=0;for(const e of d.cards){n+=e.qty;const c=S.cards.get(e.id);if(c)val+=e.qty*(unitPrice(c,false)||0);}return {n,val};}
function deckCI(d){
  const set=new Set();const pick=d.cards.filter(e=>e.board==='commander');const src=pick.length?pick:d.cards;
  for(const e of src){const c=S.cards.get(e.id);if(c)(c.ci||[]).forEach(x=>set.add(x));}
  return 'WUBRG'.split('').filter(x=>set.has(x));
}
function deckCover(d){const e=d.cards.find(x=>x.board==='commander')||d.cards[0];return e&&S.cards.get(e.id);}
function renderDeckList(){
  S.deckId=null;setHeader({title:'Decks'});
  const rows=[...S.decks].sort((a,b)=>(b.updated||0)-(a.updated||0)).map(d=>{const st=deckStats(d),cv=deckCover(d);
    return `<button class="deckrow" data-a="deck" data-id="${d.id}">${cv?art(cv):'<span class="art"></span>'}<div class="rmain"><b>${esc(d.name)}</b><div class="line">${ciIcons(deckCI(d))}<span class="sub">${esc(d.format)} · ${st.n} cards · ${money(st.val)}</span></div></div><span class="muted">›</span></button>`;}).join('');
  $('#view').innerHTML=`
    <form id="newdeck" class="bar" style="flex-wrap:nowrap"><input type="text" id="dn" placeholder="New deck name" maxlength="60" required autocomplete="off" autocapitalize="words" enterkeyhint="done" role="combobox" aria-expanded="false" aria-controls="dsug" style="flex:2"><select id="df" aria-label="Format" style="flex:1.1">${FORMATS.map(f=>`<option>${f}</option>`).join('')}</select><button class="btn primary" type="submit">Create</button></form>
    <div id="dsug" class="sug" role="listbox" aria-label="Card name suggestions"></div>
    ${S.decks.length?rows:'<p class="empty">No decks yet. There is no limit on how many you can make.</p>'}`;
}
function deckData(d){
  const own=ownedByName(),boards={commander:[],main:[],side:[]},need=new Map();
  for(const e of d.cards){const c=S.cards.get(e.id);if(!c)continue;(boards[e.board]||boards.main).push({e,c});if(e.board!=='side')need.set(c.name,(need.get(c.name)||0)+e.qty);}
  const lack=n=>Math.max(0,(need.get(n)||0)-(own.get(n)||0));
  return {own,boards,need,lack};
}
function deckTabs(){return `<div class="tabs">${[['cards','Cards',IC.decks],['stats','Stats',IC.chart],['info','Info',IC.info]].map(([k,l,i])=>`<button class="${S.dtab===k?'on':''}" data-a="dtab" data-t="${k}">${i}<span>${l}</span></button>`).join('')}</div>`;}
function renderDeck(){
  const d=deckById(S.deckId);if(!d){renderDeckList();return;}
  const st=deckStats(d);
  setHeader({back:true,center:true,title:d.name,sub:`${esc(d.format)} · ${st.n} cards ${ciIcons(deckCI(d))}`,tabs:deckTabs()});
  ({cards:deckCardsView,stats:deckStatsView,info:deckInfoView})[S.dtab](d);
}
function deckRow(x,D){
  const {e,c}=x,lack=e.board==='side'?0:D.lack(c.name);
  return `<div class="row" data-a="card" data-id="${c.id}" data-board="${e.board}">${art(c)}<div class="rmain"><b>${esc(c.name)}</b><div class="line">${costHTML(c.mana)||`<span class="sub">${esc(c.type)}</span>`}${lack?`<span class="need">need ${lack} more</span>`:''}</div></div><div class="qty" data-stop><button data-a="ddec" data-id="${c.id}" data-board="${e.board}" aria-label="Remove one">−</button><span>${e.qty}</span><button data-a="dinc" data-id="${c.id}" data-board="${e.board}" aria-label="Add one">+</button></div></div>`;
}
function deckCardsView(d){
  const D=deckData(d),B=D.boards;
  const head=(icon,title,n,plus)=>`<div class="sec">${icon}<span>${title}</span><span class="cnt">${n}</span>${plus?`<button data-a="adddeck" aria-label="Add cards">${IC.plus}</button>`:''}</div>`;
  const qty=l=>l.reduce((a,x)=>a+x.e.qty,0);
  const byType=list=>{const g={};list.forEach(x=>{(g[typeGroup(x.c.type)]??=[]).push(x);});
    return [...TYPES,'Other'].filter(t=>g[t]).map(t=>head(typeIcon(t)||'',PLURAL[t],qty(g[t]))+g[t].sort((a,b)=>a.c.cmc-b.c.cmc||a.c.name.localeCompare(b.c.name)).map(x=>deckRow(x,D)).join('')).join('');};
  let h=`<div class="bar"><button class="searchbox" data-a="adddeck">${IC.search}<span>Add cards</span></button></div>`;
  if(!d.cards.length)h+='<p class="empty">This deck is empty.<br>Tap Add cards, or open the Info tab to import a list.</p>';
  if(B.commander.length)h+=head('<i class="ms ms-planeswalker"></i>','Commander',qty(B.commander))+B.commander.map(x=>deckRow(x,D)).join('');
  if(B.main.length)h+=byType(B.main);
  if(B.side.length)h+=head('','Sideboard',qty(B.side))+B.side.sort((a,b)=>a.c.name.localeCompare(b.c.name)).map(x=>deckRow(x,D)).join('');
  $('#view').innerHTML=h;
}
function deckStatsView(d){
  const D=deckData(d),play=[...D.boards.commander,...D.boards.main],st=deckStats(d);
  if(!play.length){$('#view').innerHTML='<p class="empty">Add some cards to see stats.</p>';return;}
  const nl=play.filter(x=>typeGroup(x.c.type)!=='Land'),nlq=nl.reduce((a,x)=>a+x.e.qty,0);
  const avg=nlq?nl.reduce((a,x)=>a+x.c.cmc*x.e.qty,0)/nlq:0;
  const curve=Array(8).fill(0);nl.forEach(x=>{curve[Math.min(7,Math.floor(x.c.cmc))]+=x.e.qty;});
  const mx=Math.max(1,...curve);
  const types={};play.forEach(x=>{const g=typeGroup(x.c.type);types[g]=(types[g]||0)+x.e.qty;});
  const tmx=Math.max(1,...Object.values(types));
  const pips={W:0,U:0,B:0,R:0,G:0};
  play.forEach(x=>{for(const m of (x.c.mana||'').matchAll(/\{([^}]+)\}/g))for(const col of 'WUBRG')if(m[1].includes(col))pips[col]+=x.e.qty;});
  const pmx=Math.max(1,...Object.values(pips));
  const top=[...d.cards].map(e=>({e,c:S.cards.get(e.id)})).filter(x=>x.c).map(x=>({c:x.c,v:(unitPrice(x.c,false)||0)})).sort((a,b)=>b.v-a.v).slice(0,5);
  $('#view').innerHTML=`
    <div class="stats"><div class="stat"><b>${st.n}</b><span>Cards</span></div><div class="stat"><b>${avg.toFixed(2)}</b><span>Avg. mana value</span></div><div class="stat"><b>${money(st.val)}</b><span>Value</span></div></div>
    <h3>Mana curve</h3><div class="curve">${curve.map((n,i)=>`<div><b>${n||''}</b><i style="height:${Math.round(n/mx*88)}px"></i><span>${i===7?'7+':i}</span></div>`).join('')}</div>
    <h3>Card types</h3>${[...TYPES,'Other'].filter(t=>types[t]).map(t=>`<div class="hb"><i class="ms ms-${TYPE_ICON[t]||'multiple'} ty"></i><span class="lbl">${t}</span><span class="bg"><i style="width:${types[t]/tmx*100}%"></i></span><span class="n">${types[t]}</span></div>`).join('')}
    <h3>Color pips</h3>${'WUBRG'.split('').filter(k=>pips[k]).map(k=>`<div class="hb"><span class="mc lg"><i class="ms ms-${k.toLowerCase()} ms-cost ms-shadow"></i></span><span class="bg"><i style="width:${pips[k]/pmx*100}%"></i></span><span class="n">${pips[k]}</span></div>`).join('')||'<p class="sub">No colored mana symbols.</p>'}
    <h3>Most valuable</h3>${top.map(x=>`<div class="kv"><span style="color:var(--ink)">${esc(x.c.name)}</span><b>${money(x.v)}</b></div>`).join('')}`;
}
function deckInfoView(d){
  const D=deckData(d),st=deckStats(d);
  const miss=[];let cost=0;
  for(const [name,q] of D.need){const l=D.lack(name);if(l){const c=[...D.boards.commander,...D.boards.main].find(x=>x.c.name===name).c;const p=(unitPrice(c,false)||0)*l;cost+=p;miss.push({name,l,p});}}
  miss.sort((a,b)=>a.name.localeCompare(b.name));

function deckToCollection(d,mode){
  const plan=[];
  if(mode==='all'){for(const e of d.cards)if(S.cards.has(e.id))plan.push({id:e.id,qty:e.qty});}
  else{
    const own=ownedByName(),left=new Map();
    for(const e of d.cards){const c=S.cards.get(e.id);if(c)left.set(c.name,(left.has(c.name)?left.get(c.name):0)+e.qty);}
    for(const [n,q] of left)left.set(n,Math.max(0,q-(own.get(n)||0)));
    for(const e of d.cards){const c=S.cards.get(e.id);if(!c)continue;const r=left.get(c.name)||0;const add=Math.min(e.qty,r);if(add>0){plan.push({id:e.id,qty:add});left.set(c.name,r-add);}}
  }
  return plan;
}
function deckText(d){
  const line=e=>{const c=S.cards.get(e.id);return c?`${e.qty} ${c.name} (${c.set.toUpperCase()}) ${c.cn}`:null;};
  const part=b=>d.cards.filter(e=>e.board===b).map(line).filter(Boolean);
  const out=[];const cm=part('commander');if(cm.length)out.push('Commander',...cm,'');out.push(...part('main'));const sb=part('side');if(sb.length)out.push('','Sideboard',...sb);
  return out.join('\n');
}

const TESS_VER='5.1.1';
const LANG_PATH='https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int';
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('Could not load text recognition. Check your connection.'));document.head.appendChild(el);});}
function getWorker(){
  const sc=S.scan;
  if(!sc.workerP){
    sc.workerP=(async()=>{
      if(!window.Tesseract)await loadScript(`https://cdn.jsdelivr.net/npm/tesseract.js@${TESS_VER}/dist/tesseract.min.js`);
      const w=await window.Tesseract.createWorker('eng',1,{langPath:LANG_PATH,logger:()=>{}});
      await w.setParameters({tessedit_pageseg_mode:'7',user_defined_dpi:'300'});
      return w;
    })().catch(e=>{sc.workerP=null;throw e;});
  }
  return sc.workerP;
}
async function startCamera(){
  const sc=S.scan;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){sc.msg='This browser does not allow camera access here.';updateScanUI();return;}
  try{
    sc.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$('#vid');if(v){v.srcObject=sc.stream;v.play().catch(()=>{});}
    sc.msg='Fit the whole card in the white frame, with its name inside the amber box.';
    updateScanUI();
    getWorker().catch(e=>{sc.msg=e.message;updateScanUI();});
  }catch(e){
    sc.stream=null;
    sc.msg=e&&e.name==='NotAllowedError'?'Camera access was blocked. Allow the camera for this site in Chrome settings, then try again.':'Could not start the camera'+(e&&e.name?' ('+e.name+')':'')+'.';
    updateScanUI();
  }
}
function stopCamera(){const sc=S.scan;sc.auto=false;if(sc.stream){sc.stream.getTracks().forEach(t=>t.stop());sc.stream=null;}}
function stripRect(v){
  const g=$('.gname'),vr=v.getBoundingClientRect(),gr=g.getBoundingClientRect();
  const sc=Math.max(vr.width/v.videoWidth,vr.height/v.videoHeight);
  const offX=(v.videoWidth*sc-vr.width)/2,offY=(v.videoHeight*sc-vr.height)/2;
  let x=(gr.left-vr.left+offX)/sc,y=(gr.top-vr.top+offY)/sc,w=gr.width/sc,h=gr.height/sc;
  x=Math.max(0,x);y=Math.max(0,y);w=Math.min(w,v.videoWidth-x);h=Math.min(h,v.videoHeight-y);
  return {x,y,w,h};
}
function prepCanvas(v){
  const r=stripRect(v),W=Math.min(900,Math.round(r.w*2)),H=Math.round(r.h*W/r.w);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,r.x,r.y,r.w,r.h,0,0,W,H);
  const im=x.getImageData(0,0,W,H),d=im.data,hist=new Uint32Array(256);let sum=0;
  for(let i=0;i<d.length;i+=4){const g=Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2]);d[i]=g;hist[g]++;sum+=g;}
  const n=d.length/4,mean=sum/n;let a=0,lo=0,hi=255;
  for(let i=0;i<256;i++){a+=hist[i];if(a>=n*.02){lo=i;break;}}a=0;
  for(let i=0;i<256;i++){a+=hist[i];if(a>=n*.98){hi=i;break;}}
  if(hi-lo<10)hi=lo+10;
  const inv=mean<115;
  for(let i=0;i<d.length;i+=4){let g=Math.max(0,Math.min(255,(d[i]-lo)*255/(hi-lo)));if(inv)g=255-g;d[i]=d[i+1]=d[i+2]=g;}
  x.putImageData(im,0,0);
  const out=document.createElement('canvas');out.width=W+40;out.height=H+40;
  const ox=out.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,out.width,out.height);ox.drawImage(c,20,20);
  return out;
}
function cleanRead(t){
  const w=String(t||'').replace(/[^A-Za-zÀ-ſ ,'’\-]/g,' ').replace(/’/g,"'").split(/\s+/).filter(Boolean);
  while(w.length>1&&w[0].length===1&&!/^[aAiI]$/.test(w[0]))w.shift();
  while(w.length>1&&w[w.length-1].length===1)w.pop();
  return w.join(' ');
}
async function lookupName(text){
  try{return {card:remember([await sf('/cards/named?fuzzy='+encodeURIComponent(text))],false)[0]};}
  catch(e){
    if(e.status!==404&&e.status!==400)throw e;
    try{const a=await sf('/cards/autocomplete?q='+encodeURIComponent(text));return {cands:(a.data||[]).slice(0,5)};}catch(e2){if(e2.status&&e2.status<500)return {cands:[]};throw e2;}
  }
}
async function scanOnce(auto){
  const sc=S.scan,v=$('#vid');if(sc.busy||!sc.stream||!v||!v.videoWidth)return;
  sc.busy=true;if(!auto)sc.msg='Reading…';updateScanUI();
  try{
    const worker=await getWorker();
    const {data}=await worker.recognize(prepCanvas(v));
    const text=cleanRead(data.text);
    if(text.length<3){if(!auto)sc.msg='Could not read a name. Line the name up in the amber box and hold steady.';return;}
    const r=await lookupName(text);
    if(r.card){sc.card=r.card;sc.cands=[];sc.prints=null;sc.msg='';}
    else{sc.card=null;sc.cands=r.cands||[];sc.msg=sc.cands.length?'Not sure. Did you mean one of these?':(auto?'':'No card found for “'+text+'”. Try again.');}
  }catch(e){sc.msg=navigator.onLine?(e.message||'Scan failed.'):'No connection. Scanning needs the internet to look cards up.';sc.auto=false;}
  finally{sc.busy=false;updateScanUI();}
}

    case 'copydeck':{const t=deckText(deckById(S.deckId));try{await navigator.clipboard.writeText(t);toast('Deck list copied');}catch{download('deck.txt',t,'text/plain');}break;}
    case 'renamedeck':{const d=deckById(S.deckId);const n=prompt('Deck name',d.name);if(n&&n.trim()){d.name=n.trim().slice(0,60);saveDeck(d);renderDeck();}break;}
    case 'deletedeck':{const d=deckById(S.deckId);if(confirm('Delete "'+d.name+'"? Your collection is not affected.')){S.decks=S.decks.filter(x=>x!==d);idb.del('decks',d.id);S.target=S.target===d.id?null:S.target;navBack();}break;}
    case 'deck2coll':{const d=deckById(S.deckId),plan=deckToCollection(d,el.dataset.mode),n=plan.reduce((a,x)=>a+x.qty,0);
      if(!n){toast(el.dataset.mode==='all'?'This deck is empty':'You already own every card in this deck');break;}
      if(confirm('Add '+n+' card'+(n===1?'':'s')+' from "'+d.name+'" to your collection?')){plan.forEach(x=>collAdd(x.id,false,x.qty));toast('Added '+n+' card'+(n===1?'':'s')+' to your collection');renderDeck();}
      break;}
    case 'dsugpick':{const inp=$('#dn');if(inp){inp.value=el.dataset.name;inp.focus();}sugSeq++;showSuggestions([],'');break;}
    case 'importdeck':openImportDeck();break;
    case 'doimport':doImportDeck();break;
    case 'refresh':refreshAll(false);renderSync();break;
    case 'scanstart':startCamera();break;
    case 'scanstop':stopCamera();updateScanUI();break;
    case 'scanshot':scanOnce(false);break;
    case 'scanauto':S.scan.auto=!S.scan.auto;if(S.scan.auto)autoLoop();updateScanUI();break;
    case 'scanopen':if(S.scan.card)openCard(S.scan.card.id);break;
    case 'scanadd':{const c=S.scan.card,foil=el.dataset.foil==='1';if(c){collAdd(c.id,foil,1);S.scan.log.push({id:c.id,foil});scanDone('Added '+c.name+(foil?' (foil)':''));}break;}
    case 'scandeck':{const c=S.scan.card,d=S.target&&deckById(S.target);if(c&&d){deckAdd(d,c.id,'main',1);scanDone('Added '+c.name+' to '+d.name);}break;}
    case 'scanskip':scanDone('');break;
    case 'scanprints':loadPrints();break;
    case 'scanpick':{const p=S.cards.get(id);if(p){S.scan.card=p;updateScanUI();}break;}
    case 'scanname':{try{S.scan.msg='';S.scan.card=remember([await sf('/cards/named?exact='+encodeURIComponent(el.dataset.name))],false)[0];S.scan.cands=[];S.scan.prints=null;}catch(e){S.scan.msg='Could not look that up.';}updateScanUI();break;}
    case 'scanundo':{const l=S.scan.log.pop();if(l){collAdd(l.id,l.foil,-1);toast('Removed last scan');}updateScanUI();break;}
    case 'exportcsv':exportCSV();break;
    case 'exportjson':exportJSON();break;
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){S.search.q=ev.target.value;clearTimeout(runSearch.t);runSearch.t=setTimeout(()=>runSearch(),450);}
  if(ev.target.id==='dn'){clearTimeout(suggestNames.t);const v=ev.target.value;suggestNames.t=setTimeout(()=>suggestNames(v),250);}
  if(ev.target.id==='cq'){S.collQ=ev.target.value;S.collLimit=100;renderCollList();}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='csort'){S.collSort=ev.target.value;renderCollList();}
  if(ev.target.id==='csvfile'&&ev.target.files[0])importCSV(ev.target.files[0]);
  if(ev.target.id==='jsonfile'&&ev.target.files[0])restoreJSON(ev.target.files[0]);
});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='newdeck'){ev.preventDefault();const n=$('#dn').value.trim();if(!n)return;
    sugSeq++;const d={id:uid(),name:n.slice(0,60),format:$('#df').value,cards:[],created:Date.now(),updated:Date.now()};S.decks.push(d);saveDeck(d);S.deckId=d.id;S.dtab='cards';pushNav();renderDeck();}
});
function openImportDeck(){
  const d=deckById(S.deckId);
  $('#dlg').innerHTML=`<div class="sheet"><h2>Import deck list</h2><p class="sub">Paste a list like “4 Lightning Bolt” or “1 Sol Ring (CMM) 400”. Section headers like [COMMANDER] or Sideboard put cards in that section.</p>
    <textarea id="dtext" placeholder="4 Lightning Bolt&#10;20 Mountain&#10;&#10;Sideboard&#10;2 Smash to Smithereens"></textarea>
    <div class="bar"><select id="dmode" aria-label="Import mode"><option value="add">Add to this deck</option><option value="replace" ${d&&d.cards.length?'selected':''}>Replace this deck's cards</option></select></div>
    <div class="bar"><button class="btn primary" data-a="doimport">Import</button><button class="btn" data-a="close">Cancel</button></div><p id="impmsg" class="sub"></p></div>`;
  $('#dlg').showModal();
}
async function doImportDeck(){
  const d=deckById(S.deckId),list=parseDecklist($('#dtext').value);if(!list.length){$('#impmsg').textContent='No card lines found.';return;}
  const replace=$('#dmode').value==='replace';
  $('#impmsg').textContent='Looking up cards…';
  try{
    const seen=new Map();list.forEach(x=>{const k=x.set&&x.cn?'sc:'+x.set+'/'+x.cn:'n:'+x.name.toLowerCase();if(!seen.has(k))seen.set(k,x.set&&x.cn?{set:x.set,collector_number:x.cn}:{name:x.name});});
    const {found}=await fetchCollection([...seen.values()],(a,b)=>{$('#impmsg').textContent='Looking up cards '+a+' of '+b+'…';});
    remember(found,true);
    const by=new Map();found.forEach(c=>cardKeys(c).forEach(k=>{if(!by.has(k))by.set(k,c);}));
    if(replace)d.cards=[];
    let ok=0;const miss=[];
    for(const x of list){const c=(x.set&&x.cn&&by.get('sc:'+x.set+'/'+x.cn))||by.get('n:'+x.name.toLowerCase())||[...by.values()].find(v=>v.name.toLowerCase().startsWith(x.name.toLowerCase()+' //'));
      if(c){deckAdd(d,c.id,x.board,x.qty);ok+=x.qty;}else miss.push(x.name);}
    saveDeck(d);$('#dlg').close();S.dtab='cards';renderDeck();
    toast(`Imported ${ok} cards`+(miss.length?` · not found: ${miss.slice(0,3).join(', ')}${miss.length>3?'…':''}`:''));
  }catch(e){$('#impmsg').textContent='Import failed: '+(navigator.onLine?e.message:'no connection');}
}

/* ---------- boot ---------- */
async function load(){
  const [cards,coll,decks,lr]=await Promise.all([idb.all('cards'),idb.all('collection'),idb.all('decks'),idb.get('meta','lastRefresh')]);
  S.cards=new Map(cards.map(c=>[c.id,c]));S.coll=new Map(coll.map(e=>[e.id,e]));S.decks=decks;S.lastRefresh=lr||0;
}
(async function boot(){
  buildNav();
  try{
    db=await openDB();await load();
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){setHeader({title:'Pocket Binder'});$('#view').innerHTML='<p class="err">This browser blocked on-device storage, so nothing can be saved. Try opening the app in Chrome outside private mode.</p>';return;}
  if(history.state&&typeof history.state.i==='number'){const st=history.state;navIdx=st.i;S.tab=st.tab||'search';S.deckId=st.deckId||null;S.dtab=st.dtab||'cards';buildNav();}else replaceNav();
  render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  // Refresh once a day, and right away if saved cards are missing newer fields (art, colors).
  const stale=referencedIds().some(id=>{const c=S.cards.get(id);return !c||c.v!==CARD_V;});
  if(navigator.onLine&&(stale||Date.now()-S.lastRefresh>864e5))refreshAll(true);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCamera();if(S.tab==='scan')updateScanUI();});
  addEventListener('online',()=>{if(Date.now()-S.lastRefresh>864e5)refreshAll(true);});
})();
</script>
</body>
