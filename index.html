<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1b1e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Pocket Binder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="mana/mana.css">
<style>
:root{
  --bg:#f2f2f0; --surface:#ffffff; --raise:#ebebe8; --ink:#17171a; --muted:#6b6b73; --line:#dcdcd7;
  --accent:#c47a00; --accent-ink:#ffffff; --accent-soft:rgba(196,122,0,.15);
  --good:#1d7a4a; --warn:#b25a00; --bad:#b3261e;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0f11; --surface:#1b1b1e; --raise:#27272b; --ink:#ececef; --muted:#9b9ba4; --line:#2d2d32;
  --accent:#f5a31a; --accent-ink:#1a1100; --accent-soft:rgba(245,163,26,.17);
  --good:#62d49a; --warn:#f0b36a; --bad:#ff8c84; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:24px;height:24px;display:block;flex:none}

/* top bar */
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left))}
.hrow{display:flex;align-items:center;gap:6px;min-height:58px}
.hbtn{width:44px;height:44px;border:0;border-radius:50%;background:none;display:grid;place-items:center}
.hbtn:active{background:var(--raise)}
.htitle{flex:1;min-width:0;padding:0 8px}
.htitle h1{margin:0;font:700 19px/1.2 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsub{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;line-height:1.3}
.center .htitle{text-align:center}.center .hsub{justify-content:center}
#status{font-size:12px;color:var(--muted);text-align:right;max-width:42%;padding-right:8px}
.tabs{display:flex}
.tabs button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

.app{max-width:760px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left)) calc(92px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}
h2{font:700 18px/1.25 var(--sans);margin:18px 0 8px}
h3{font:700 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:22px 0 8px}
p{margin:6px 0}
.sub{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}

/* mana & type icons */
.mc{display:inline-flex;align-items:center;gap:2px;font-size:15px;vertical-align:middle}
.mc.lg{font-size:19px}
.mc .ms-cost{margin:0}
.oracle .ms-cost{font-size:.9em;vertical-align:-.15em;margin:0 1px}
.ty{color:var(--muted);font-size:15px}

/* rows */
.row,.deckrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.art{width:66px;height:48px;object-fit:cover;border-radius:8px;background:var(--raise);flex:none;display:block}
.rmain{flex:1;min-width:0}
.rmain b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.line{display:flex;align-items:center;gap:8px;min-height:20px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--raise);border-radius:999px;padding:2px;flex:none}
.qty button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;font-size:19px;line-height:1}
.qty button:active{background:var(--line)}
.qty span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.sec{display:flex;align-items:center;gap:10px;background:var(--raise);margin:16px calc(-1 * max(14px,env(safe-area-inset-left))) 0;padding:10px max(14px,env(safe-area-inset-left));font-weight:700;letter-spacing:.05em;font-size:13px;text-transform:uppercase}
.sec .ms{font-size:18px;color:var(--muted)}
.sec .cnt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.sec button{border:0;background:none;color:var(--accent);padding:0 0 0 8px;display:grid;place-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 16px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input[type=search],input[type=text],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
textarea{padding:10px 14px;min-height:150px;resize:vertical}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:48px;color:var(--muted);width:100%;text-align:left}
.searchbox input{border:0;background:none;padding:0;min-height:44px;flex:1;outline:0}
.searchbox:focus-within{border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface);font-size:13.5px;font-weight:600}
.chip[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px;margin-top:12px}
.tile{position:relative}
.tile .open{display:block;width:100%;background:none;border:0;padding:0;text-align:left}
.tile img{width:100%;aspect-ratio:488/680;object-fit:cover;border-radius:8px;background:var(--raise);display:block}
.tile .t{margin-top:5px;font-size:13px;line-height:1.25}
.tile .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .add{position:absolute;right:6px;top:6px;width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 1px 5px #0007}
.tile .own{position:absolute;left:6px;top:6px;background:var(--good);color:#04150d;border-radius:999px;font-size:12px;font-weight:700;padding:2px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
.stat b{display:block;font:700 21px/1.15 var(--sans);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.banner{background:var(--accent-soft);border-radius:12px;padding:8px 12px;margin-top:12px;display:flex;align-items:center;gap:10px}
.banner span{flex:1}
.curve{display:flex;align-items:flex-end;gap:7px;height:130px;margin:10px 0 4px;padding-top:6px}
.curve div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--muted);gap:3px}
.curve i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px}
.curve b{color:var(--ink);font-weight:700;font-size:12.5px}
.hb{display:flex;align-items:center;gap:12px;padding:7px 0}
.hb .ms{width:24px;text-align:center;font-size:19px;flex:none}
.hb .bg{flex:1;height:10px;background:var(--raise);border-radius:5px;overflow:hidden}
.hb .bg i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hb .n{min-width:30px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.hb .lbl{width:96px;flex:none}
.need{color:var(--warn);font-size:12.5px;font-weight:600}
.empty{color:var(--muted);padding:30px 4px;text-align:center}
.err{color:var(--bad);padding:10px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--muted)}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 max(0px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(0px,env(safe-area-inset-left))}
nav button{flex:1;border:0;background:none;padding:8px 0 8px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
nav button.on{color:var(--accent)}
nav button.on .pill{background:var(--accent-soft)}

dialog{border:0;padding:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;margin:auto auto 0;max-height:94vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:#000a}
.sheet{padding:14px max(16px,env(safe-area-inset-left)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.sheet .big{width:min(260px,70%);aspect-ratio:488/680;border-radius:13px;display:block;margin:6px auto 12px;background:var(--raise)}
.sheet h2{margin-top:4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.oracle{white-space:pre-line}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;width:min(100%,46vh);margin:12px auto 0}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;left:50%;top:50%;height:88%;aspect-ratio:5/7;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.5);pointer-events:none}
.gname{position:absolute;left:5%;width:72%;top:3.5%;height:8%;border:2px solid #f5a31a;border-radius:6px}
.camoff{position:absolute;inset:0;display:grid;place-items:center;color:#cfcfd4;text-align:center;padding:24px;font-size:14px}
.scanres{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:6px}
.scanres .thumb{width:84px;aspect-ratio:488/680;border-radius:6px;background:var(--raise);flex:none;display:block;border:0;padding:0}
.scanres .thumb img{width:100%;height:100%;border-radius:6px;display:block}
.pts{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px}
.pt{flex:none;width:92px;background:none;border:2px solid transparent;border-radius:10px;padding:3px;text-align:left;font-size:12px;line-height:1.25}
.pt img{width:100%;aspect-ratio:488/680;border-radius:6px;display:block;background:var(--raise)}
.pt.on{border-color:var(--accent)}
.sug{margin:-2px 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sug:empty{display:none}
.sug button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:0 14px;min-height:46px;font-size:15px}
.sug button:last-child{border-bottom:0}
.sug button:active{background:var(--raise)}
.sug b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip .ms{font-size:16px}
.chip.ico{padding:6px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.cgrid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:8px;margin-top:10px}
.ctile{position:relative;min-width:0}
.ctile .open{display:block;width:100%;background:none;border:0;padding:0;text-align:left}
.ctile img{width:100%;aspect-ratio:488/680;object-fit:cover;border-radius:6px;background:var(--raise);display:block}
.ctile .cap{display:block;margin-top:4px;font-size:13px;line-height:1.3;color:var(--muted)}
.ctile .cap b{display:block;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctile .iw{display:block;position:relative}
.ctile .db{position:absolute;left:5px;bottom:5px;display:inline-flex;align-items:center;gap:2px;background:var(--accent);color:#1a1200;border-radius:999px;font-size:11px;font-weight:800;padding:2px 6px;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.ctile .db .ic{width:13px;height:13px}
.indeck{flex:none;display:inline-flex;align-items:center;gap:3px;background:var(--accent-soft);color:var(--accent);border-radius:999px;font-size:11.5px;font-weight:700;padding:1px 8px}
.indeck .ic{width:12px;height:12px}
.ctile .qb{position:absolute;right:5px;top:5px;background:rgba(0,0,0,.72);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px;pointer-events:none}
.ctile .fb{position:absolute;left:5px;top:5px;background:linear-gradient(135deg,#8fb2ff,#f5a31a);color:#111;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 7px;pointer-events:none}
.sec .ic{width:18px;height:18px;color:var(--muted)}
.got{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--good);flex:none}
.got:active{background:var(--raise)}
.hbtn+.hbtn{margin-left:-4px}
body.life-on .app{padding:0;max-width:none}
.life{position:fixed;left:0;right:0;z-index:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:6px;padding:6px max(6px,env(safe-area-inset-left)) 6px max(6px,env(safe-area-inset-right));background:var(--bg);-webkit-touch-callout:none}
.life.one{grid-template-columns:1fr}
.ptile{position:relative;border-radius:18px;background:hsl(var(--h) 42% 26%);color:#fff;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation;min-height:0}
.ptile.rot{transform:rotate(180deg)}
.ptile.dead{filter:grayscale(.85) brightness(.65)}
.ptile.first{box-shadow:inset 0 0 0 4px #fff}
.ptile button{color:inherit}
.pname{align-self:center;margin-top:6px;border:0;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:600;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmain{position:relative;flex:1;min-height:0;display:flex}
.zone{flex:1;display:grid;place-items:center;font-size:42px;font-weight:300;color:rgba(255,255,255,.4);touch-action:manipulation}
.zone.m{place-items:center start;padding-left:14%}.zone.pl{place-items:center end;padding-right:14%}
.zone:active{background:rgba(255,255,255,.1)}
.plife{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.plife b{font:700 clamp(46px,15vw,92px)/1 var(--sans);font-variant-numeric:tabular-nums}
.life.one .plife b{font-size:clamp(70px,28vw,150px)}
.pdelta{font-size:18px;min-height:22px;font-style:normal;opacity:.85;font-weight:600}
.pfoot{display:flex;flex-wrap:wrap;gap:6px;padding:4px 8px 8px;align-items:center;justify-content:center;min-height:40px}
.pc{background:rgba(0,0,0,.28);border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:600}
.pcbtn{border:1px solid rgba(255,255,255,.35);background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 4px;font-weight:700}
.clist{flex:1;overflow:auto;padding:0 10px 10px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px}
.crow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csub{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;margin:8px 0 2px}
.cq{display:inline-flex;align-items:center;gap:4px;flex:none}
.cq button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.18);font-size:18px;line-height:1}
.cq b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:hsl(var(--h) 60% 60%)}
.lmenu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:var(--surface);color:var(--ink);border:1px solid var(--line);z-index:3;display:grid;place-items:center;box-shadow:0 2px 10px #0007}
.diceout{font:700 44px/1.1 var(--sans);text-align:center;padding:10px 0;min-height:64px;font-variant-numeric:tabular-nums}
.ptile.hasart{background-size:cover!important;background-position:center!important}
.ptile.hasart .plife b,.ptile.hasart .pname,.ptile.hasart .pc,.ptile.hasart .pdelta,.ptile.hasart .clabel{text-shadow:0 1px 8px rgba(0,0,0,.9)}
.ptile.spin{box-shadow:inset 0 0 0 5px #fff;filter:brightness(1.35)}
.pbadge{position:absolute;top:4px;right:8px;display:flex;gap:2px;pointer-events:none;z-index:2}
.pbadge .ic{width:28px;height:28px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.pbadge .crown{color:#ffd24a}.pbadge .crown .ic{fill:rgba(255,210,74,.35)}
.pbadge .heal{color:#ffb3c1}
.pname.static{pointer-events:none}
.clabel{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;opacity:.9;text-align:center;max-width:80%;line-height:1.25;margin-bottom:2px}
.ptile.cmdsrc .zone{color:rgba(255,255,255,.55)}
.ptile.lethal .plife b{color:#ff8a80}
.ptile.cmdrecv{box-shadow:inset 0 0 0 4px #ff8a80}
.cmdhint{display:inline-flex;align-items:center;gap:4px}
.cmdhint .ic{width:16px;height:16px}
.pbres{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.pbres button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600}
.pbprev{height:110px;border-radius:12px;background:var(--raise) center/cover;margin:8px 0;display:grid;place-items:end start;padding:8px 12px;color:#fff;font-weight:700;text-shadow:0 1px 6px #000;font-size:14px}
.pbprev:empty{display:none}
.stage{perspective:600px;display:grid;place-items:center;min-height:132px;margin:8px 0 4px}
.coin{width:96px;height:96px;position:relative;transform-style:preserve-3d}
.coin.hop{animation:hop 1.6s cubic-bezier(.3,.6,.4,1)}
@keyframes hop{0%,100%{margin-top:0}40%{margin-top:-46px}}
.cf{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:800;font-size:12px;letter-spacing:.08em;color:#4a3300;background:radial-gradient(circle at 35% 30%,#ffe9a3,#e0a82e 70%,#a87413);border:4px solid #c68f1f;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.cf .ic{width:38px;height:38px;display:block;margin:0 auto 2px}
.cf.tail{transform:rotateY(180deg)}
.die{width:92px;height:92px;border-radius:18px;background:#f7f4ec;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.4);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12px;gap:2px}
.die i{border-radius:50%;margin:3px;background:transparent}.die i.on{background:#1b1b1e}
.d20{width:112px;height:112px;position:relative;display:grid;place-items:center}
.d20 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.d20 .o{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.d20 .l{fill:none;stroke:var(--accent);stroke-width:1.6;opacity:.8;stroke-linejoin:round}
.d20 b{position:relative;font:800 30px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--ink)}

'use strict';
/*PURE-START*/
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){row.push(f);f='';}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f);f=''; if(row.length>1||row[0]!=='') rows.push(row); row=[]; }
    else f+=ch;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function csvToRows(text){
  const rows=parseCSV(text.replace(/^﻿/,'')); if(rows.length<2) return [];
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=(...names)=>{for(const n of names){const i=h.indexOf(n);if(i>=0)return i;}return -1;};
  const iName=col('name','card name'),iSet=col('set code','set','edition code'),iCn=col('collector number','collector_number','number'),
        iFoil=col('foil'),iQty=col('quantity','qty','count'),iId=col('scryfall id','scryfall_id');
  const get=(r,i)=>i<0?'':String(r[i]??'').trim();
  return rows.slice(1).map(r=>({
    name:get(r,iName), set:get(r,iSet).toLowerCase(), cn:get(r,iCn), id:get(r,iId).toLowerCase(),
    foil:/^(foil|etched|true|yes|1)$/i.test(get(r,iFoil)), qty:parseInt(get(r,iQty)||'1',10)||1
  })).filter(r=>r.id||r.name);
}
function planImport(rows){
  const map=new Map(),idents=[];
  for(const r of rows){
    const key=r.id?'id:'+r.id:(r.set&&r.cn)?'sc:'+r.set+'/'+r.cn:'n:'+r.name.toLowerCase();
    let e=map.get(key);
    if(!e){e={qty:0,foil:0,used:false,ident:r.id?{id:r.id}:(r.set&&r.cn)?{set:r.set,collector_number:r.cn}:{name:r.name}};map.set(key,e);idents.push(e.ident);}
    if(r.foil) e.foil+=r.qty; else e.qty+=r.qty;
  }
  return {map,idents};
}
function cardKeys(c){return ['id:'+c.id,'sc:'+c.set+'/'+c.collector_number,'n:'+String(c.name).toLowerCase()];}
function parseDecklist(text){
  const out=[];let board='main';
  for(const raw of text.split(/\r?\n/)){
    let line=raw.trim(); if(!line||line.startsWith('//')||line.startsWith('#')) continue;
    const hm=line.match(/^\[(.+)\]$/);
    if(hm){const n=hm[1].trim().toLowerCase();board=(n==='commander'||n==='commanders')?'commander':n==='sideboard'?'side':(n==='wishlist'||n==='wish list')?'wish':(n==='maybeboard'||n==='considering')?'skip':'main';continue;}
    const h=line.replace(/:$/,'').toLowerCase();
    if(h==='sideboard'||h==='sb'){board='side';continue;}
    if(h==='commander'||h==='commanders'){board='commander';continue;}
    if(h==='wishlist'||h==='wish list'){board='wish';continue;}
    if(h==='deck'||h==='main'||h==='mainboard'){board='main';continue;}
    if(h==='maybeboard'||h==='considering'){board='skip';continue;}
    let b=board; if(/^sb:\s*/i.test(line)){line=line.replace(/^sb:\s*/i,'');b='side';}
    if(b==='skip') continue;
    const m=line.match(/^(\d+)\s*x?\s+(.+?)(?:\s+\(([A-Za-z0-9]{2,6})\)(?:\s+([\w\-★]+))?)?\s*(?:\*[A-Za-z]+\*)?$/);
    if(!m) continue;
    out.push({qty:+m[1],name:m[2].trim(),set:m[3]?m[3].toLowerCase():'',cn:m[4]||'',board:b});
  }
  return out;
}
/* two-device sync: per-record last-writer-wins with tombstones */
function normSnap(j){j=j||{};const t=j.tomb||{};return {coll:Array.isArray(j.coll)?j.coll:[],decks:Array.isArray(j.decks)?j.decks:[],tomb:{coll:t.coll||{},decks:t.decks||{}}};}
function snapKey(m){
  const ks=o=>Object.keys(o).sort().map(k=>[k,o[k]]);
  return JSON.stringify([m.coll.slice().sort((a,b)=>a.id<b.id?-1:1).map(e=>[e.id,e.qty,e.foil,e.t||0]),
    m.decks.slice().sort((a,b)=>a.id<b.id?-1:1).map(d=>[d.id,d.updated||0,JSON.stringify(d)]),ks(m.tomb.coll),ks(m.tomb.decks)]);
}
function mergeSync(L,R){
  L=normSnap(L);R=normSnap(R);
  const tomb={coll:{},decks:{}};
  for(const k of ['coll','decks']){
    for(const id of new Set([...Object.keys(L.tomb[k]),...Object.keys(R.tomb[k])]))tomb[k][id]=Math.max(L.tomb[k][id]||0,R.tomb[k][id]||0);
  }
  const lc=new Map(L.coll.map(e=>[e.id,e])),rc=new Map(R.coll.map(e=>[e.id,e])),coll=[];
  for(const id of new Set([...lc.keys(),...rc.keys()])){
    const a=lc.get(id),b=rc.get(id);let w;
    if(a&&b){const ta=a.t||0,tb=b.t||0;w=ta>tb?a:tb>ta?b:{id,qty:Math.max(a.qty,b.qty),foil:Math.max(a.foil,b.foil),t:ta};}
    else w=a||b;
    if((tomb.coll[id]||0)>(w.t||0))continue;
    coll.push(w);
  }
  const ld=new Map(L.decks.map(d=>[d.id,d])),rd=new Map(R.decks.map(d=>[d.id,d])),decks=[];
  for(const id of new Set([...ld.keys(),...rd.keys()])){
    const a=ld.get(id),b=rd.get(id);let w;
    if(a&&b){const ta=a.updated||0,tb=b.updated||0;w=ta>tb?a:tb>ta?b:(JSON.stringify(a)>=JSON.stringify(b)?a:b);}
    else w=a||b;
    if((tomb.decks[id]||0)>(w.updated||0))continue;
    decks.push(w);
  }
  return {coll,decks,tomb};
}
/*PURE-END*/

function sym(code){const c=code.toLowerCase().replace(/\//g,'');const a={t:'tap',q:'untap'};const k=a[c]||c;

/* ---------- storage ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('pocket-binder',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('cards',{keyPath:'id'});d.createObjectStore('collection',{keyPath:'id'});d.createObjectStore('decks',{keyPath:'id'});d.createObjectStore('meta');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const idb={
  all:s=>new Promise((res,rej)=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}),
  get:(s,k)=>new Promise((res,rej)=>{const q=db.transaction(s).objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}),
  put:(s,v,k)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');k===undefined?t.objectStore(s).put(v):t.objectStore(s).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}),
  putMany:(s,vs)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');const o=t.objectStore(s);vs.forEach(v=>o.put(v));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}),
  del:(s,k)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}),

function faceImg(c,k){const u=c.image_uris||(c.card_faces&&c.card_faces[0]&&c.card_faces[0].image_uris)||{};return u[k]||'';}

/* ---------- Scryfall ---------- */
let lastCall=0;
async function sf(path,opt={}){
  const wait=Math.max(0,lastCall+110-Date.now());lastCall=Date.now()+wait;if(wait)await sleep(wait);
  const url=path.startsWith('http')?path:'https://api.scryfall.com'+path;
  const headers={Accept:'application/json;q=0.9,*/*;q=0.8'};if(opt.body)headers['Content-Type']='application/json';
  for(let i=0;i<2;i++){
    const r=await fetch(url,{...opt,headers});
    if(r.status===429&&i===0){await sleep(2500);continue;}
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const e=new Error(j.details||('Scryfall error '+r.status));e.status=r.status;throw e;}
    return j;
  }
}
async function fetchCollection(idents,onProgress){
  const found=[],missing=[];
  for(let i=0;i<idents.length;i+=75){
    const j=await sf('/cards/collection',{method:'POST',body:JSON.stringify({identifiers:idents.slice(i,i+75)})});
    found.push(...j.data);missing.push(...(j.not_found||[]));
    if(onProgress)onProgress(Math.min(i+75,idents.length),idents.length);
  }
  return {found,missing};
}
function statusIdle(){
  if(!S.lastRefresh)return 'Prices not yet updated';
  const h=Math.round((Date.now()-S.lastRefresh)/36e5);
  return 'Prices updated '+(h<1?'just now':h<48?h+'h ago':Math.round(h/24)+'d ago');
}
function setStatus(t){const el=$('#status');if(el)el.textContent=t||statusIdle();}
const referencedIds=()=>[...new Set([...S.coll.keys(),...S.decks.flatMap(d=>d.cards.map(c=>c.id))])];
async function refreshAll(auto){
  if(S.busy)return;
  const ids=referencedIds();
  if(!ids.length){if(!auto)toast('Nothing to update yet');return;}
  S.busy=true;
  try{
    const {found}=await fetchCollection(ids.map(id=>({id})),(a,b)=>setStatus('Updating '+a+' of '+b+'…'));
    remember(found,true);
    S.lastRefresh=Date.now();await idb.put('meta',S.lastRefresh,'lastRefresh');
    if(!auto)toast('Updated '+found.length+' cards');
  }catch(e){if(!auto)toast('Could not reach Scryfall. Try again online.');}
  finally{S.busy=false;setStatus();refreshView();}
}

/* shuffle: random cards that match your filters */
const SHUF0=()=>({colors:[],cmode:'any',ident:false,types:[],cmc:[],rarity:[],fmt:'',cmdr:false,text:''});
const SHUF_FMTS=['commander','standard','pioneer','modern','legacy','vintage','pauper'];
try{const j=JSON.parse(localStorage.getItem('pb-shuf')||'null');S.shuf={f:Object.assign(SHUF0(),j||{}),cards:[],loading:false,err:'',empty:false,seq:0,tried:false};}catch(e){S.shuf={f:SHUF0(),cards:[],loading:false,err:'',empty:false,seq:0,tried:false};}
const saveShuf=()=>{try{localStorage.setItem('pb-shuf',JSON.stringify(S.shuf.f));}catch(e){}};
const shufCount=()=>{const f=S.shuf.f;return (f.colors.length?1:0)+(f.types.length?1:0)+(f.cmc.length?1:0)+(f.rarity.length?1:0)+(f.fmt?1:0)+(f.cmdr?1:0)+(f.text.trim()?1:0);};
function shufQuery(){
  const f=S.shuf.f,parts=['game:paper'];
  if(f.colors.length){
    const real=f.colors.filter(k=>k!=='C').map(k=>k.toLowerCase()).join(''),hasC=f.colors.includes('C');
    if(f.ident){
      if(f.cmode==='exact')parts.push(real?`id=${real}`:'id:c');
      else parts.push(real?`id<=${real}`:'id:c');
    }else if(f.cmode==='exact')parts.push(real?`c=${real}`:'c:c');
    else{const alt=f.colors.map(k=>k==='C'?'c:c':'c:'+k.toLowerCase());parts.push(alt.length>1?`(${alt.join(' or ')})`:alt[0]);}
  }
  if(f.types.length)parts.push(f.types.length>1?`(${f.types.map(t=>'t:'+t.toLowerCase()).join(' or ')})`:'t:'+f.types[0].toLowerCase());
  if(f.cmc.length){const alt=f.cmc.map(n=>n>=7?'mv>=7':'mv='+n);parts.push(alt.length>1?`(${alt.join(' or ')})`:alt[0]);}
  if(f.rarity.length){const alt=f.rarity.map(r=>'r:'+r[0]);parts.push(alt.length>1?`(${alt.join(' or ')})`:alt[0]);}
  if(f.fmt)parts.push('f:'+f.fmt);
  if(f.cmdr)parts.push('is:commander');
  f.text.trim().split(/\s+/).filter(Boolean).slice(0,6).forEach(w=>parts.push('o:"'+w.replace(/["\\]/g,'')+'"'));
  return parts.join(' ');
}

    <h3>Rarity</h3><div class="chips">${['common','uncommon','rare','mythic'].map(r=>chip('sfr',r,r[0].toUpperCase()+r.slice(1),f.rarity.includes(r))).join('')}</div>

async function shuffleCards(){
  const h=S.shuf;if(h.loading)return;
  const seq=++h.seq,q=shufQuery(),got=[],seen=new Set();
  h.loading=true;h.err='';h.empty=false;h.cards=[];renderShuffleUI();renderShuffleResults();
  try{
    for(let tries=0;got.length<6&&tries<12;tries++){
      let c;try{c=await sf('/cards/random?q='+encodeURIComponent(q));}catch(e){if(e.status===404){if(!got.length)h.empty=true;break;}throw e;}
      if(seq!==h.seq)return;
      const key=c.oracle_id||c.name;if(seen.has(key))continue;seen.add(key);
      got.push(remember([c],false)[0]);h.cards=got.slice();renderShuffleResults();
    }
  }catch(e){if(seq===h.seq)h.err=navigator.onLine?e.message:'No connection. Shuffle needs the internet; your collection and decks still work offline.';}
  finally{if(seq===h.seq){h.loading=false;if(h.cards.length)h.fopen=false;renderShuffleUI();renderShuffleResults();}}
}
/* "Return of the Wildspeaker 203", "Sol Ring FRC 21", "Sol Ring (FRC) 21" or "FDN 203" -> a specific printing */
let KNOWN_SETS=null;
async function loadSets(){
  if(KNOWN_SETS)return;
  try{const j=JSON.parse(localStorage.getItem('pb-sets')||'null');if(j&&Date.now()-j.t<30*864e5&&j.c&&j.c.length){KNOWN_SETS=new Set(j.c);return;}}catch(e){}
  try{const r=await sf('/sets');KNOWN_SETS=new Set((r.data||[]).map(x=>x.code));try{localStorage.setItem('pb-sets',JSON.stringify({t:Date.now(),c:[...KNOWN_SETS]}));}catch(e){}}catch(e){}
}
function searchAttempts(q){
  q=q.trim();const raw=[{q,prints:null}];
  if(/[:=<>!]/.test(q))return raw;
  const t=q.split(/\s+/);if(t.length<2)return raw;
  const num=t[t.length-1];if(!/^\d{1,4}[a-z★]?$/i.test(num))return raw;
  const rest=t.slice(0,-1),last=rest[rest.length-1];
  const clean=w=>w.join(' ').replace(/["\\()]/g,'').trim();
  const cn=num.toLowerCase(),m=/^\(?([a-z0-9]{3,5})\)?$/i.exec(last),paren=/^\(.*\)$/.test(last);
  const setTry=m?{q:`${clean(rest.slice(0,-1))?`"${clean(rest.slice(0,-1))}" `:''}set:${m[1].toLowerCase()} cn:${cn}`,prints:true}:null;
  const nm=clean(rest),nameTry=nm&&!paren?{q:`"${nm}" cn:${cn}`,prints:true}:null;
  const known=m&&KNOWN_SETS&&KNOWN_SETS.has(m[1].toLowerCase());
  const out=[];
  if(setTry&&(paren||known))out.push(setTry);          // a real set code: use it first
  if(nameTry)out.push(nameTry);                          // otherwise treat everything as the name
  if(setTry&&!paren&&!known&&!KNOWN_SETS)out.push(setTry); // set list unavailable: still try it
  // nothing with that number: show every printing of the card so you can pick the right one
  const only=clean((m&&(paren||known))?rest.slice(0,-1):rest);
  if(only)out.push({q:`!"${only}"`,prints:true,note:`No printing numbered ${num} was found, so this shows every printing of ${only}.`});
  return out.concat(raw);
}
async function runSearch(more){
  const s=S.search,q=s.q.trim();if(!more&&!q){s.results=[];s.empty=false;s.err='';renderResults();return;}
  const seq=++s.seq;s.loading=true;s.err='';s.empty=false;if(!more)s.note='';renderResults();
  try{
    let j;
    if(more)j=await sf(s.next);
    else{
      if(/\s\(?\w+\)?\s+\d{1,4}[a-z★]?\s*$/i.test(q)||/\s\d{1,4}[a-z★]?\s*$/i.test(q))await loadSets();
      if(seq!==s.seq)return;
      const tries=searchAttempts(q);let lastErr;
      for(const t of tries){
        try{const wantP=t.prints===null?s.prints:t.prints;j=await sf(`/cards/search?q=${encodeURIComponent(t.q)}&unique=${wantP?'prints':'cards'}&order=name${wantP?'&include_extras=true&include_variations=true':''}`);if(seq!==s.seq)return;s.note=t.note||'';break;}
        catch(e){if(seq!==s.seq)return;lastErr=e;if(e.status!==404&&e.status!==400)throw e;}
      }
      if(!j)throw lastErr;
    }
    if(seq!==s.seq)return;
    const cs=remember(j.data,false);
    s.results=more?s.results.concat(cs):cs;s.total=j.total_cards||s.results.length;s.next=j.has_more?j.next_page:null;
  }catch(e){
    if(seq!==s.seq)return;
    if(e.status===404||e.status===400){if(!more){s.results=[];s.total=0;s.next=null;}s.empty=!more;}
    else s.err=navigator.onLine?e.message:'No connection. Search needs the internet; your collection and decks still work offline.';
  }finally{if(seq===s.seq){s.loading=false;renderResults();}}
}

/* collection */
function activeFilters(){const f=S.filt;return (f.types.length?1:0)+(f.colors.length?1:0)+(f.cmc.length?1:0)+(f.rarity.length?1:0)+(f.foil!=='any'?1:0)+(f.deck!=='any'?1:0)+(f.set?1:0)+(f.text.trim()?1:0);}
function passesFilters(c,e){
  const f=S.filt;
  if(f.types.length&&!f.types.some(t=>(c.type||'').includes(t)))return false;
  if(f.colors.length){
    const cc=c.colors||[],sel=f.colors;
    if(f.cmode==='exact'){
      const want=sel.filter(x=>x!=='C').sort().join(''),have=cc.slice().sort().join('');
      if(want!==have)return false;
    }else if(!sel.some(x=>x==='C'?cc.length===0:cc.includes(x)))return false;
  }
  if(f.cmc.length&&!f.cmc.includes(Math.min(7,Math.floor(c.cmc||0))))return false;
  if(f.rarity.length&&!f.rarity.includes(c.rarity))return false;
  if(f.foil==='foil'&&!e.foil)return false;
  if(f.foil==='nonfoil'&&!e.qty)return false;
  if(f.deck==='in'&&!deckUse(c.id))return false;
  if(f.deck==='out'&&deckUse(c.id))return false;
  if(f.set&&c.set!==f.set)return false;
  const words=f.text.toLowerCase().split(/\s+/).filter(Boolean);
  if(words.length){const t=(c.text||'').toLowerCase();if(!words.every(w=>t.includes(w)))return false;}
  return true;
}
/* copies of each printing currently placed in a deck (wishlist cards don't count) */
let _du=null;
function deckUse(id){if(!_du){_du=new Map();for(const d of S.decks)for(const e of d.cards){if(e.board==='wish')continue;_du.set(e.id,(_du.get(e.id)||0)+e.qty);}}return _du.get(id)||0;}
function deckNames(id){return S.decks.filter(d=>d.cards.some(e=>e.id===id&&e.board!=='wish')).map(d=>d.name);}
function collAllItems(){_du=null;return [...S.coll.values()].map(e=>({e,c:S.cards.get(e.id)})).filter(x=>x.c);}
function collFiltered(all){
  let items=all;
  const q=S.collQ.trim().toLowerCase();
  if(q)items=items.filter(x=>x.c.name.toLowerCase().includes(q)||x.c.set_name.toLowerCase().includes(q)||x.c.type.toLowerCase().includes(q));
  items=items.filter(x=>passesFilters(x.c,x.e));
  const sorters={name:(a,b)=>a.c.name.localeCompare(b.c.name),value:(a,b)=>entryValue(b.e)-entryValue(a.e),qty:(a,b)=>(b.e.qty+b.e.foil)-(a.e.qty+a.e.foil)};
  return items.sort(sorters[S.collSort]||sorters.name);
}

function deckToCollection(d,mode){
  const plan=[];
  if(mode==='all'){for(const e of d.cards)if(e.board!=='wish'&&S.cards.has(e.id))plan.push({id:e.id,qty:e.qty});}
  else{
    const own=ownedByName(),left=new Map();
    for(const e of d.cards){if(e.board==='wish')continue;const c=S.cards.get(e.id);if(c)left.set(c.name,(left.has(c.name)?left.get(c.name):0)+e.qty);}
    for(const [n,q] of left)left.set(n,Math.max(0,q-(own.get(n)||0)));
    for(const e of d.cards){if(e.board==='wish')continue;const c=S.cards.get(e.id);if(!c)continue;const r=left.get(c.name)||0;const add=Math.min(e.qty,r);if(add>0){plan.push({id:e.id,qty:add});left.set(c.name,r-add);}}
  }
  return plan;
}
function deckText(d){
  const line=e=>{const c=S.cards.get(e.id);return c?`${e.qty} ${c.name} (${c.set.toUpperCase()}) ${c.cn}`:null;};
  const part=b=>d.cards.filter(e=>e.board===b).map(line).filter(Boolean);
  const out=[];const cm=part('commander');if(cm.length)out.push('Commander',...cm,'');out.push(...part('main'));const sb=part('side');if(sb.length)out.push('','Sideboard',...sb);const wl=part('wish');if(wl.length)out.push('','Wishlist',...wl);
  return out.join('\n');
}

async function importCSV(file){
  if(S.busy)return;S.busy=true;const replace=$('#impmode')&&$('#impmode').value==='replace';
  try{
    const rows=csvToRows(await file.text());if(!rows.length){toast('No cards found in that file');return;}
    const {map,idents}=planImport(rows);
    const {found,missing}=await fetchCollection(idents,(a,b)=>setStatus('Importing '+a+' of '+b+'…'));
    remember(found,true);
    if(replace){const now=Date.now();for(const id of S.coll.keys())S.tomb.coll[id]=now;await idb.put('meta',S.tomb,'tomb');S.coll.clear();await idb.clear('collection');}
    let added=0;
    for(const c of found){const k=cardKeys(c).find(k=>map.has(k)&&!map.get(k).used);if(!k)continue;const x=map.get(k);x.used=true;
      const e=S.coll.get(c.id)||{id:c.id,qty:0,foil:0};e.qty+=x.qty;e.foil+=x.foil;e.t=Date.now();delete S.tomb.coll[c.id];S.coll.set(c.id,e);added+=x.qty+x.foil;}
    await idb.putMany('collection',[...S.coll.values()]);await idb.put('meta',S.tomb,'tomb');syncSoon();
    toast(`Imported ${added} cards`+(missing.length?` · ${missing.length} not found`:''));
  }catch(e){toast('Import failed: '+(navigator.onLine?e.message:'no connection'));}
  finally{S.busy=false;setStatus();renderSync();}
}
function exportCSV(){
  const rows=[['Name','Set code','Set name','Collector number','Foil','Rarity','Quantity','Scryfall ID']];

async function syncNow(manual){

const hexId=id=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id)?id.replace(/-/g,''):id;

async function encodeShare(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream==='function'){try{return 'z'+b64uEnc(await pipeBytes(raw,new CompressionStream('deflate-raw')));}catch(e){}}
  return 'r'+b64uEnc(raw);
}
async function decodeShare(t){
  const bytes=b64uDec(t.slice(1));

  return JSON.parse(new TextDecoder().decode(raw));
}

const TESS_VER='5.1.1';
const LANG_PATH='https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int';

async function startCamera(){

    const v=$('#vid');if(v){v.srcObject=sc.stream;v.play().catch(()=>{});}

function stopCamera(){const sc=S.scan;sc.auto=false;if(sc.stream){sc.stream.getTracks().forEach(t=>t.stop());sc.stream=null;}}
function stripRect(v){
  const g=$('.gname'),vr=v.getBoundingClientRect(),gr=g.getBoundingClientRect();
  const sc=Math.max(vr.width/v.videoWidth,vr.height/v.videoHeight);
  const offX=(v.videoWidth*sc-vr.width)/2,offY=(v.videoHeight*sc-vr.height)/2;
  let x=(gr.left-vr.left+offX)/sc,y=(gr.top-vr.top+offY)/sc,w=gr.width/sc,h=gr.height/sc;
  x=Math.max(0,x);y=Math.max(0,y);w=Math.min(w,v.videoWidth-x);h=Math.min(h,v.videoHeight-y);
  return {x,y,w,h};
}
function prepCanvas(v){
  const r=stripRect(v),W=Math.min(900,Math.round(r.w*2)),H=Math.round(r.h*W/r.w);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,r.x,r.y,r.w,r.h,0,0,W,H);
  const im=x.getImageData(0,0,W,H),d=im.data,hist=new Uint32Array(256);let sum=0;
  for(let i=0;i<d.length;i+=4){const g=Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2]);d[i]=g;hist[g]++;sum+=g;}
  const n=d.length/4,mean=sum/n;let a=0,lo=0,hi=255;
  for(let i=0;i<256;i++){a+=hist[i];if(a>=n*.02){lo=i;break;}}a=0;
  for(let i=0;i<256;i++){a+=hist[i];if(a>=n*.98){hi=i;break;}}
  if(hi-lo<10)hi=lo+10;
  const inv=mean<115;
  for(let i=0;i<d.length;i+=4){let g=Math.max(0,Math.min(255,(d[i]-lo)*255/(hi-lo)));if(inv)g=255-g;d[i]=d[i+1]=d[i+2]=g;}
  x.putImageData(im,0,0);
  const out=document.createElement('canvas');out.width=W+40;out.height=H+40;
  const ox=out.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,out.width,out.height);ox.drawImage(c,20,20);
  return out;
}
function cleanRead(t){
  const w=String(t||'').replace(/[^A-Za-zÀ-ſ ,'’\-]/g,' ').replace(/’/g,"'").split(/\s+/).filter(Boolean);
  while(w.length>1&&w[0].length===1&&!/^[aAiI]$/.test(w[0]))w.shift();
  while(w.length>1&&w[w.length-1].length===1)w.pop();
  return w.join(' ');
}
async function lookupName(text){

  }

async function scanOnce(auto){

  sc.busy=true;if(!auto)sc.msg='Reading…';updateScanUI();

    if(text.length<3){if(!auto)sc.msg='Could not read a name. Line the name up in the amber box and hold steady.';return;}
    const r=await lookupName(text);
    if(r.card){sc.card=r.card;sc.cands=[];sc.prints=null;sc.msg='';}
    else{sc.card=null;sc.cands=r.cands||[];sc.msg=sc.cands.length?'Not sure. Did you mean one of these?':(auto?'':'No card found for “'+text+'”. Try again.');}
  }catch(e){sc.msg=navigator.onLine?(e.message||'Scan failed.'):'No connection. Scanning needs the internet to look cards up.';sc.auto=false;}

function renderScan(){

function lifeChange(i,d){

function cmdChange(r,src,d){
  const p=S.life.players[r];if(!p)return;
  const old=p.cmd[src]||0,nv=Math.max(0,old+d);if(nv===old)return;
  p.cmd[src]=nv;p.life-=nv-old;

  if(st){const b=st.querySelector('.plife b');if(b)b.textContent=nv;st.classList.toggle('lethal',nv>=21);}

/* ---------- dice, coin, first-player spin, player sheet ---------- */
const reduceMotion=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const dieHTML=n=>`<div class="die" id="die" role="img" aria-label="Die showing ${n}">${[...Array(9)].map((_,k)=>`<i${PIPS[n].includes(k)?' class="on"':''}></i>`).join('')}</div>`;
const d20HTML=n=>`<div class="d20" id="d20"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon class="o" points="50,4 91,27 91,73 50,96 9,73 9,27"/><polygon class="l" points="50,22 79,68 21,68"/><path class="l" d="M50 4V22M91 27L79 68M9 27L21 68M50 96L21 68M50 96L79 68M9 73L21 68M91 73L79 68M9 27L50 22M91 27L50 22"/></svg><b>${n}</b></div>`;
const coinHTML=()=>`<div class="coin" id="coin"><div class="cf head">${IC.crown}<span>HEADS</span></div><div class="cf tail"><span style="font-size:30px;line-height:1">★</span><span>TAILS</span></div></div>`;
let rollTok=0;
function rollVisual(kind){
  const stage=$('#dicestage'),out=$('#diceout');if(!stage)return;
  const tok=++rollTok,still=reduceMotion();
  const rnd=n=>1+Math.floor(Math.random()*n);
  if(kind==='coin'){
    const r=rnd(2);stage.dataset.result=r===1?'Heads':'Tails';out.textContent='Flipping…';stage.innerHTML=coinHTML();
    const c=$('#coin');
    const done=()=>{if(tok===rollTok)out.textContent=stage.dataset.result;};
    if(still){c.style.transform=r===1?'':'rotateY(180deg)';done();return;}
    c.classList.add('hop');c.getBoundingClientRect();
    c.style.transition='transform 1.6s cubic-bezier(.25,.7,.25,1)';c.style.transform=`rotateY(${5*360+(r===1?0:180)}deg)`;
    setTimeout(done,1650);return;
  }
  const n=kind==='d6'?6:20,r=rnd(n);stage.dataset.result=r;out.textContent='Rolling…';
  const draw=v=>{stage.innerHTML=n===6?dieHTML(v):d20HTML(v);return stage.firstElementChild;};
  const fin=()=>{if(tok!==rollTok)return;const el=draw(r);el.classList.add('land');
    if(n===20){el.classList.toggle('crit',r===20);el.classList.toggle('fumble',r===1);}
    out.textContent=n===20&&r===20?'20 — natural 20!':n===20&&r===1?'1 — critical fail':String(r);};
  if(still){fin();return;}
  let t0=Date.now();draw(rnd(n)).classList.add('tumble');
  const iv=setInterval(()=>{if(tok!==rollTok){clearInterval(iv);return;}
    if(Date.now()-t0>1000){clearInterval(iv);fin();return;}
    const el=stage.firstElementChild,v=rnd(n);
    if(n===6){el.outerHTML=dieHTML(v);stage.firstElementChild.classList.add('tumble');}
    else{el.querySelector('b').textContent=v;}},85);
}
let spinTok=0;
async function spinFirst(){
  const L=S.life,alive=L.players.map((p,i)=>i).filter(i=>!isDead(L.players[i])),pool=alive.length?alive:L.players.map((p,i)=>i);
  const tok=++spinTok,k=pool.length,target=Math.floor(Math.random()*k);
  const prevF=S.first,prevS=S.spin;S.first=-1;S.spin=-1;if(prevF>=0)redrawTile(prevF);if(prevS>=0)redrawTile(prevS);
  const N=target+1+k*Math.ceil(Math.max(0,14-(target+1))/k);
  const quick=reduceMotion();
  for(let j=0;j<N&&!quick;j++){
    if(tok!==spinTok||S.tab!=='life')return;
    const idx=pool[j%k],old=S.spin;S.spin=idx;
    if(old>=0&&old!==idx){const o=$(`.ptile[data-p="${old}"]`);if(o)o.classList.remove('spin');}
    const t=$(`.ptile[data-p="${idx}"]`);if(t)t.classList.add('spin');
    try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}
    await sleep(55+Math.round(340*Math.pow(j/N,2.5)));
  }
  if(tok!==spinTok)return;
  const win=pool[target];S.spin=-1;S.first=win;
  redrawAll();
  try{navigator.vibrate&&navigator.vibrate([30,40,60]);}catch(e){}
  toast(L.players[win].name+' goes first');
  setTimeout(()=>{if(tok===spinTok&&S.first===win){S.first=-1;redrawTile(win);}},6000);
}

    case 'sff':S.shuf.f.fmt=S.shuf.f.fmt===el.dataset.v?'':el.dataset.v;saveShuf();S.shuf.fopen=true;renderShuffleUI();break;
    case 'sfcmdr':S.shuf.f.cmdr=!S.shuf.f.cmdr;saveShuf();S.shuf.fopen=true;renderShuffleUI();break;
    case 'sfclear':S.shuf.f=SHUF0();saveShuf();S.shuf.fopen=true;renderShuffleUI();break;
    case 'quick':{const d=S.target&&deckById(S.target);persistCard(id);
      if(d){deckAdd(d,id,S.targetBoard||'main',1);toast('Added to '+d.name+(S.targetBoard==='wish'?' wishlist':''));}else{collAdd(id,false,1);toast('Added to collection');}renderResults();break;}
    case 'inc':collAdd(id,false,1);renderCollList();break;
    case 'dec':{const e=S.coll.get(id);if(e){if(e.qty>0)collAdd(id,false,-1);else collAdd(id,true,-1);}renderCollList();break;}
    case 'showmore':S.collLimit+=90;renderCollList();break;
    case 'cview':S.collView=el.dataset.v;savePrefs();renderColl();break;
    case 'fopen':renderFilters();if(!$('#dlg').open)$('#dlg').showModal();break;
    case 'ftype':toggleIn(S.filt.types,el.dataset.v);S.collLimit=90;renderFilters();break;
    case 'fcolor':toggleIn(S.filt.colors,el.dataset.v);S.collLimit=90;renderFilters();break;
    case 'fcmc':toggleIn(S.filt.cmc,+el.dataset.v);S.collLimit=90;renderFilters();break;
    case 'frar':toggleIn(S.filt.rarity,el.dataset.v);S.collLimit=90;renderFilters();break;
    case 'fmode':S.filt.cmode=el.dataset.v;renderFilters();break;
    case 'fdeck':S.filt.deck=el.dataset.v;S.collLimit=90;renderFilters();break;
    case 'ffoil':S.filt.foil=el.dataset.v;S.collLimit=90;renderFilters();break;
    case 'fclear':{S.filt=FILT0();S.collQ='';S.collLimit=90;const q=$('#cq');if(q)q.value='';if($('#dlg').open&&$('#fdone'))renderFilters();else renderCollList();break;}
    case 'fdone':$('#dlg').close();break;
    case 'sinc':collAdd(sheetId,el.dataset.foil==='1',+el.dataset.d);renderSheet();refreshView();break;
    case 'sdeckadd':{const d=deckById($('#sdeck').value);sheetBoard=$('#sboard').value;if(d){deckAdd(d,sheetId,sheetBoard,1);toast('Added to '+d.name);refreshView();}break;}
    case 'prints2':{$('#dlg').close();S.search.q='!"'+el.dataset.name+'"';S.search.prints=true;setTab('search');runSearch();break;}
    case 'deck':S.deckId=id;S.dtab='cards';pushNav();renderDeck();scrollTo(0,0);break;
    case 'opendeck':S.deckId=id;S.dtab='cards';S.tab='decks';buildNav();pushNav();renderDeck();scrollTo(0,0);break;
    case 'back':navBack();break;
    case 'dtab':S.dtab=el.dataset.t;replaceNav();renderDeck();break;
    case 'cleartarget':S.target=null;S.targetBoard='main';renderSearch();break;
    case 'adddeck':S.target=S.deckId;S.targetBoard='main';setTab('search');break;
    case 'addwish':S.target=S.deckId;S.targetBoard='wish';setTab('search');break;
    case 'dinc':deckAdd(deckById(S.deckId),id,el.dataset.board,1);renderDeck();break;
    case 'ddec':deckAdd(deckById(S.deckId),id,el.dataset.board,-1);renderDeck();break;
    case 'copydeck':{const t=deckText(deckById(S.deckId));try{await navigator.clipboard.writeText(t);toast('Deck list copied');}catch{download('deck.txt',t,'text/plain');}break;}
    case 'renamedeck':{const d=deckById(S.deckId);const n=prompt('Deck name',d.name);if(n&&n.trim()){d.name=n.trim().slice(0,60);saveDeck(d);renderDeck();}break;}
    case 'deletedeck':{const d=deckById(S.deckId);if(confirm('Delete "'+d.name+'"? Your collection is not affected.')){S.decks=S.decks.filter(x=>x!==d);idb.del('decks',d.id);tombstone('decks',d.id);syncSoon();S.target=S.target===d.id?null:S.target;navBack();}break;}
    case 'deck2coll':{const d=deckById(S.deckId),plan=deckToCollection(d,el.dataset.mode),n=plan.reduce((a,x)=>a+x.qty,0);
      if(!n){toast(el.dataset.mode==='all'?'This deck is empty':'You already own every card in this deck');break;}
      if(confirm('Add '+n+' card'+(n===1?'':'s')+' from "'+d.name+'" to your collection?')){plan.forEach(x=>collAdd(x.id,false,x.qty));toast('Added '+n+' card'+(n===1?'':'s')+' to your collection');renderDeck();}
      break;}
    case 'dsugpick':{const inp=$('#dn');if(inp){inp.value=el.dataset.name;inp.focus();}sugSeq++;showSuggestions([],'');break;}
    case 'wishgot':{const d=deckById(S.deckId),e=d&&d.cards.find(x=>x.id===id&&x.board==='wish');
      if(e){const q=e.qty;d.cards=d.cards.filter(x=>x!==e);collAdd(id,false,q);deckAdd(d,id,'main',q);toast('Added to your collection and moved into the deck');renderDeck();}break;}
    case 'wishmissing':{const d=deckById(S.deckId),D=deckData(d);let n=0;
      for(const [name] of D.need){const l=D.lack(name);if(!l)continue;const ent=[...D.boards.commander,...D.boards.main].find(x=>x.c.name===name);
        const have=D.boards.wish.filter(x=>x.c.name===name).reduce((a,x)=>a+x.e.qty,0);const add=l-have;if(ent&&add>0){deckAdd(d,ent.c.id,'wish',add);n+=add;}}
      toast(n?'Added '+n+' to the wishlist':'The wishlist already covers everything missing');renderDeck();break;}
    case 'importdeck':openImportDeck();break;
    case 'doimport':doImportDeck();break;
    case 'refresh':refreshAll(false);renderSync();break;
    case 'lmenu':S.lifePend=null;lifeMenu();if(!$('#dlg').open)$('#dlg').showModal();break;
    case 'lpn':S.lifePend.n=+el.dataset.v;lifeMenu();break;
    case 'lstart':S.lifePend.start=+el.dataset.v;lifeMenu();break;
    case 'lnew':{if(confirm('Start a new game? Current life totals will be reset.')){const pd=S.lifePend;S.life=newLife(pd.n,pd.start,S.life);S.lifeView={};S.first=-1;S.spin=-1;S.cmdMode=-1;spinTok++;saveLife(true);$('#dlg').close();renderLife();}break;}
    case 'ldie':rollVisual(el.dataset.k);break;
    case 'lfirst':$('#dlg').close();spinFirst();break;
    case 'lawake':S.life.awake=!S.life.awake;saveLife(true);el.setAttribute('aria-pressed',S.life.awake);applyWake();break;
    case 'lname':playerSheet(+el.dataset.p);if(!$('#dlg').open)$('#dlg').showModal();break;
    case 'pbpick':pbPick(el.dataset.n);break;
    case 'pbclear':S.psheet.bg='';S.psheet.bgName='';paintPrev();break;
    case 'psave':{const ps=S.psheet,p=S.life.players[ps.i],nm=$('#pnin').value.trim();if(nm)p.name=nm.slice(0,20);p.bg=ps.bg;p.bgName=ps.bgName;saveLife(true);$('#dlg').close();if(S.cmdMode>=0||true)redrawAll();break;}
    case 'cmdstart':S.cmdMode=+el.dataset.p;redrawAll();break;
    case 'cmddone':S.cmdMode=-1;redrawAll();break;
    case 'lview':{const i=+el.dataset.p;S.lifeView[i]=S.lifeView[i]==='counts'?'':'counts';redrawTile(i);break;}
    case 'cinc':counterChange(+el.dataset.p,el.dataset.k,1);break;
    case 'cdec':counterChange(+el.dataset.p,el.dataset.k,-1);break;
    case 'godata':setTab('sync');break;
    case 'sharelink':shareDeckLink(deckById(S.deckId));break;
    case 'sdimport':importSharedDeck();break;
    case 'fbsignin':fbSignIn();break;
    case 'fbsignout':if(FB.auth)await FB.auth.signOut();try{localStorage.removeItem('pb-fbon');}catch(e){}FB.pub={};renderFriends();break;
    case 'fbrefresh':FB.loading=null;fbOpen();break;
    case 'fbsavecfg':{let j;try{j=JSON.parse(($('#fbcfg').value||'').replace(/^[^{]*/,'').replace(/;?\s*$/,'').replace(/'/g,'"').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}'));}catch(e){}
      if(!j||!j.apiKey||!j.projectId){FB.err='That does not look like a Firebase config. It needs apiKey and projectId.';renderFriends();break;}
      try{localStorage.setItem('pb-fb',JSON.stringify(j));}catch(e){}FB.err='';FB.loading=null;FB.ready=false;renderFriends();break;}
    case 'fbclearcfg':if(confirm('Remove the saved friends config from this device?')){try{localStorage.removeItem('pb-fb');localStorage.removeItem('pb-fbon');}catch(e){}if(FB.auth)try{await FB.auth.signOut();}catch(e){}FB.loading=null;FB.ready=false;FB.user=null;renderFriends();}break;
    case 'fbcopyrules':try{await navigator.clipboard.writeText(FB_RULES);toast('Rules copied');}catch(e){toast('Select and copy the rules text');}break;
    case 'fbname':fbSaveName($('#fbname').value);break;
    case 'fbcopycode':try{await navigator.clipboard.writeText(FB.profile.code);toast('Friend code copied');}catch(e){toast('Your code is '+FB.profile.code);}break;
    case 'fbaddfriend':fbAddFriend($('#fbcode').value);break;
    case 'fbaccept':fbAccept(id,el.dataset.n);break;
    case 'fbdecline':fbDecline(id);break;
    case 'fbremove':if(confirm('Remove this friend? They will no longer see what you share.'))fbRemove(id);break;
    case 'fbopen':if(ev.target.closest('[data-stop]'))return;openFriend(id,el.dataset.n);break;
    case 'frtab':S.fr.tab=el.dataset.v;renderFriends();break;
    case 'frdeck':openFriendDeck(id);break;
    case 'frmore':S.fr.limit=(S.fr.limit||90)+90;renderFriends();break;
    case 'frcard':{const r=S.fr.data.coll.find(x=>x.id===id);if(r){$('#dlg').innerHTML=`<div class="sheet"><div class="bar" style="justify-content:flex-end;margin:0"><button class="btn small" data-a="close">Close</button></div><img class="big" src="${esc(cardImg(id,'normal'))}" alt="${esc(r.name)}"><h2>${esc(r.name)}</h2><p class="sub">${esc(r.set.toUpperCase())} #${esc(r.cn)} · ${r.qty} normal${r.foil?`, ${r.foil} foil`:''}</p></div>`;if(!$('#dlg').open)$('#dlg').showModal();}break;}
    case 'fbsharecoll':S.share.coll=!S.share.coll;saveShare();el.setAttribute('aria-pressed',S.share.coll);if(!FB.user){toast('Sign in first');S.share.coll=false;saveShare();el.setAttribute('aria-pressed',false);break;}FB.pub.coll=null;clearTimeout(FB.t);pushShared();break;
    case 'fbsharedeck':{const d=deckById(id||S.deckId);if(!d)break;if(!FB.user){toast('Open the Friends tab and sign in first');break;}d.shared=!d.shared;saveDeck(d);el.setAttribute('aria-pressed',!!d.shared);toast(d.shared?'Friends can see this deck':'No longer shared');clearTimeout(FB.t);FB.t=setTimeout(pushShared,800);break;}
    case 'gsaveid':{const v=($('#gcid').value||'').trim();if(!/\.apps\.googleusercontent\.com$/.test(v)){toast('That does not look like a Google client ID (it ends in .apps.googleusercontent.com)');break;}setSyncCfg({cid:v,err:''});renderSync();break;}
    case 'gchangeid':setSyncCfg({cid:'',signed:false,err:''});SYNC.tc=null;renderSync();break;
    case 'gsync':syncNow(true);break;
    case 'gsignout':if(confirm('Sign out of sync on this device? Your data stays here and in Drive.')){signOutSync();renderSync();}break;
    case 'scanstart':startCamera();break;
    case 'scanstop':stopCamera();updateScanUI();break;
    case 'scanshot':scanOnce(false);break;
    case 'scanauto':S.scan.auto=!S.scan.auto;if(S.scan.auto)autoLoop();updateScanUI();break;
    case 'scanopen':if(S.scan.card)openCard(S.scan.card.id);break;
    case 'scanadd':{const c=S.scan.card,foil=el.dataset.foil==='1';if(c){collAdd(c.id,foil,1);S.scan.log.push({id:c.id,foil});scanDone('Added '+c.name+(foil?' (foil)':''));}break;}
    case 'scandeck':{const c=S.scan.card,d=S.target&&deckById(S.target);if(c&&d){deckAdd(d,c.id,S.targetBoard||'main',1);scanDone('Added '+c.name+' to '+d.name+(S.targetBoard==='wish'?' wishlist':''));}break;}
    case 'scanskip':scanDone('');break;
    case 'scanprints':loadPrints();break;
    case 'scanpick':{const p=S.cards.get(id);if(p){S.scan.card=p;updateScanUI();}break;}
    case 'scanname':{try{S.scan.msg='';S.scan.card=remember([await sf('/cards/named?exact='+encodeURIComponent(el.dataset.name))],false)[0];S.scan.cands=[];S.scan.prints=null;}catch(e){S.scan.msg='Could not look that up.';}updateScanUI();break;}
    case 'scanundo':{const l=S.scan.log.pop();if(l){collAdd(l.id,l.foil,-1);toast('Removed last scan');}updateScanUI();break;}
    case 'exportcsv':exportCSV();break;
    case 'exportjson':exportJSON();break;
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){S.search.q=ev.target.value;clearTimeout(runSearch.t);runSearch.t=setTimeout(()=>runSearch(),450);}
  if(ev.target.id==='dn'){clearTimeout(suggestNames.t);const v=ev.target.value;suggestNames.t=setTimeout(()=>suggestNames(v),250);}
  if(ev.target.id==='pbq'){clearTimeout(pbSearch.t);const v=ev.target.value;pbSearch.t=setTimeout(()=>pbSearch(v),250);}
  if(ev.target.id==='sftext'){S.shuf.f.text=ev.target.value;saveShuf();}
  if(ev.target.id==='frq'){S.fr.q=ev.target.value;S.fr.limit=90;const b=$('#frbody');if(b){const pos=ev.target.selectionStart;b.innerHTML=friendCollHTML(S.fr);const i=$('#frq');if(i){i.focus();try{i.setSelectionRange(pos,pos);}catch(e){}}}}
  if(ev.target.id==='cq'){S.collQ=ev.target.value;S.collLimit=90;renderCollList();}
  if(ev.target.id==='ftext'){S.filt.text=ev.target.value;S.collLimit=90;renderCollList();}
  if(ev.target.id==='ccols'){const n=+ev.target.value,g=$('.cgrid');S.collCols=n;$('#colsn').textContent=n;if(g)g.style.setProperty('--cols',n);}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='csort'){S.collSort=ev.target.value;savePrefs();renderCollList();}
  if(ev.target.id==='ccols'){S.collCols=+ev.target.value;savePrefs();renderCollList();}
  if(ev.target.id==='fset'){S.filt.set=ev.target.value;S.collLimit=90;renderCollList();}
  if(ev.target.id==='csvfile'&&ev.target.files[0])importCSV(ev.target.files[0]);
  if(ev.target.id==='jsonfile'&&ev.target.files[0])restoreJSON(ev.target.files[0]);
});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='newdeck'){ev.preventDefault();const n=$('#dn').value.trim();if(!n)return;
    sugSeq++;const d={id:uid(),name:n.slice(0,60),format:$('#df').value,cards:[],created:Date.now(),updated:Date.now()};S.decks.push(d);saveDeck(d);S.deckId=d.id;S.dtab='cards';pushNav();renderDeck();}
});
function openImportDeck(){
  const d=deckById(S.deckId);
  $('#dlg').innerHTML=`<div class="sheet"><h2>Import deck list</h2><p class="sub">Paste a list like “4 Lightning Bolt” or “1 Sol Ring (CMM) 400”. Section headers like [COMMANDER] or Sideboard put cards in that section.</p>
    <textarea id="dtext" placeholder="4 Lightning Bolt&#10;20 Mountain&#10;&#10;Sideboard&#10;2 Smash to Smithereens"></textarea>
    <div class="bar"><select id="dmode" aria-label="Import mode"><option value="add">Add to this deck</option><option value="replace" ${d&&d.cards.length?'selected':''}>Replace this deck's cards</option></select></div>
    <div class="bar"><button class="btn primary" data-a="doimport">Import</button><button class="btn" data-a="close">Cancel</button></div><p id="impmsg" class="sub"></p></div>`;
  $('#dlg').showModal();
}
async function doImportDeck(){
  const d=deckById(S.deckId),list=parseDecklist($('#dtext').value);if(!list.length){$('#impmsg').textContent='No card lines found.';return;}
  const replace=$('#dmode').value==='replace';
  $('#impmsg').textContent='Looking up cards…';
  try{
    const seen=new Map();list.forEach(x=>{const k=x.set&&x.cn?'sc:'+x.set+'/'+x.cn:'n:'+x.name.toLowerCase();if(!seen.has(k))seen.set(k,x.set&&x.cn?{set:x.set,collector_number:x.cn}:{name:x.name});});
    const {found}=await fetchCollection([...seen.values()],(a,b)=>{$('#impmsg').textContent='Looking up cards '+a+' of '+b+'…';});
    remember(found,true);
    const by=new Map();found.forEach(c=>cardKeys(c).forEach(k=>{if(!by.has(k))by.set(k,c);}));
    if(replace)d.cards=[];
    let ok=0;const miss=[];
    for(const x of list){const c=(x.set&&x.cn&&by.get('sc:'+x.set+'/'+x.cn))||by.get('n:'+x.name.toLowerCase())||[...by.values()].find(v=>v.name.toLowerCase().startsWith(x.name.toLowerCase()+' //'));
      if(c){deckAdd(d,c.id,x.board,x.qty);ok+=x.qty;}else miss.push(x.name);}
    saveDeck(d);$('#dlg').close();S.dtab='cards';renderDeck();
    toast(`Imported ${ok} cards`+(miss.length?` · not found: ${miss.slice(0,3).join(', ')}${miss.length>3?'…':''}`:''));
  }catch(e){$('#impmsg').textContent='Import failed: '+(navigator.onLine?e.message:'no connection');}
}

/* ---------- boot ---------- */
async function load(){
  const [cards,coll,decks,lr]=await Promise.all([idb.all('cards'),idb.all('collection'),idb.all('decks'),idb.get('meta','lastRefresh')]);
  S.cards=new Map(cards.map(c=>[c.id,c]));S.coll=new Map(coll.map(e=>[e.id,e]));S.decks=decks;S.lastRefresh=lr||0;
  const tb=await idb.get('meta','tomb');S.tomb={coll:(tb&&tb.coll)||{},decks:(tb&&tb.decks)||{}};
}
(async function boot(){
  buildNav();
  try{
    db=await openDB();await load();
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){setHeader({title:'Pocket Binder'});$('#view').innerHTML='<p class="err">This browser blocked on-device storage, so nothing can be saved. Try opening the app in Chrome outside private mode.</p>';return;}
  if(history.state&&typeof history.state.i==='number'){const st=history.state;navIdx=st.i;S.tab=st.tab||'search';S.deckId=st.deckId||null;S.dtab=st.dtab||'cards';buildNav();}else replaceNav();
  loadShare();render();openShareFromHash();
  fbLoadFileCfg().then(()=>{try{if(localStorage.getItem('pb-fbon')&&fbConfig())fbInit().then(async()=>{if(FB.user){await fbEnsureProfile();await fbLoadFriends();shareSoon();}}).catch(()=>{});}catch(e){}if(S.tab==='friends')renderFriends();});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  // Refresh once a day, and right away if saved cards are missing newer fields (art, colors).
  const stale=referencedIds().some(id=>{const c=S.cards.get(id);return !c||c.v!==CARD_V;});
  if(navigator.onLine&&(stale||Date.now()-S.lastRefresh>864e5))refreshAll(true);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stopCamera();releaseWake();}else if(S.tab==='life')applyWake();if(S.tab==='scan')updateScanUI();});
  addEventListener('online',()=>{if(Date.now()-S.lastRefresh>864e5)refreshAll(true);if(syncCfg().signed&&SYNC.dirty&&tokenOK())syncNow(false);});
  // Sync: pull the other device's changes when you come back to the app, and re-sign-in silently on your first tap (browsers only allow that popup from a tap).
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&syncCfg().signed&&clientId()&&tokenOK()&&Date.now()-SYNC.lastTry>60000)syncNow(false);});
  document.addEventListener('click',()=>{if(syncCfg().signed&&clientId()&&!tokenOK()&&!SYNC.busy&&Date.now()-SYNC.lastTry>10*60000)syncNow(false);},true);
})();
</script>
