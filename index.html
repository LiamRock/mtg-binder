<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1815" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef2ee" media="(prefers-color-scheme: light)">
<title>Pocket Binder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#eef2ee; --surface:#fbfcfa; --raise:#e3eae5; --ink:#14201b; --muted:#5a6a62; --line:#d0dbd3;
  --accent:#2b5fc7; --accent-ink:#ffffff; --good:#1d7a4a; --warn:#a85a0b; --bad:#b3261e;
  --serif:ui-serif,"Iowan Old Style",Georgia,"Noto Serif",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1815; --surface:#16231f; --raise:#1f2f29; --ink:#e3ece7; --muted:#93a59b; --line:#27382f;
  --accent:#8fb2ff; --accent-ink:#0a1530; --good:#5fd39a; --warn:#f0b36a; --bad:#ff8c84; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left)) calc(84px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line)}
header h1{font:600 22px/1 var(--serif);margin:0;letter-spacing:.01em}
#status{font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right}
h2{font:600 19px/1.2 var(--serif);margin:18px 0 8px;text-wrap:balance}
h3{font:600 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:20px 0 8px}
p{margin:6px 0}
.sub{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.row,.deckrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row img,.deckrow img{width:44px;aspect-ratio:488/680;object-fit:cover;border-radius:4px;background:var(--raise);flex:none}
.rmain{flex:1;min-width:0}
.rmain b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--raise);border-radius:999px;padding:2px}
.qty button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;font-size:18px;line-height:1}
.qty button:active{background:var(--line)}
.qty span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;min-height:44px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
a.btn{color:var(--ink)}
.btn.small{min-height:36px;padding:0 11px;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input[type=search],input[type=text],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px}
textarea{padding:10px 12px;min-height:150px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);font-size:13.5px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px;margin-top:12px}
.tile{position:relative;background:none;border:0;padding:0;text-align:left}
.tile img{width:100%;aspect-ratio:488/680;object-fit:cover;border-radius:7px;background:var(--raise);display:block}
.tile .t{margin-top:5px;font-size:13px;line-height:1.25}
.tile .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .add{position:absolute;right:6px;top:6px;width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:22px;line-height:1;box-shadow:0 1px 4px #0006}
.tile .own{position:absolute;left:6px;top:6px;background:var(--good);color:#04150d;border-radius:999px;font-size:12px;font-weight:700;padding:2px 8px}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0 4px}
.stats div{display:flex;flex-direction:column}
.stats b{font:600 22px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.banner{background:var(--raise);border-radius:10px;padding:8px 12px;margin-top:10px;display:flex;align-items:center;gap:10px}
.banner span{flex:1}
.curve{display:flex;align-items:flex-end;gap:6px;height:84px;margin:6px 0 2px}
.curve div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11.5px;color:var(--muted)}
.curve i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.need{color:var(--warn);font-size:12.5px}
.empty{color:var(--muted);padding:26px 4px;text-align:center}
.err{color:var(--bad);padding:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;min-height:58px;font-size:13px;font-weight:600;color:var(--muted);position:relative}
nav button.on{color:var(--accent)}
nav button.on::before{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
dialog{border:0;padding:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;margin:auto auto 0;max-height:94vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:#000a}
.sheet{padding:14px max(16px,env(safe-area-inset-left)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.sheet .big{width:min(260px,70%);aspect-ratio:488/680;border-radius:12px;display:block;margin:6px auto 12px;background:var(--raise)}
.sheet h2{margin-top:4px}
.oracle{white-space:pre-line}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.foot{margin-top:28px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><h1>Pocket Binder</h1><span id="status"></span></header>
  <main id="view"></main>
</div>
<nav aria-label="Sections">
  <button data-tab="search" class="on">Search</button>
  <button data-tab="coll">Collection</button>
  <button data-tab="decks">Decks</button>
  <button data-tab="sync">Data</button>
</nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/*PURE-START*/
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){row.push(f);f='';}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f);f=''; if(row.length>1||row[0]!=='') rows.push(row); row=[]; }
    else f+=ch;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function csvToRows(text){
  const rows=parseCSV(text.replace(/^﻿/,'')); if(rows.length<2) return [];
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=(...names)=>{for(const n of names){const i=h.indexOf(n);if(i>=0)return i;}return -1;};
  const iName=col('name','card name'),iSet=col('set code','set','edition code'),iCn=col('collector number','collector_number','number'),
        iFoil=col('foil'),iQty=col('quantity','qty','count'),iId=col('scryfall id','scryfall_id');
  const get=(r,i)=>i<0?'':String(r[i]??'').trim();
  return rows.slice(1).map(r=>({
    name:get(r,iName), set:get(r,iSet).toLowerCase(), cn:get(r,iCn), id:get(r,iId).toLowerCase(),
    foil:/^(foil|etched|true|yes|1)$/i.test(get(r,iFoil)), qty:parseInt(get(r,iQty)||'1',10)||1
  })).filter(r=>r.id||r.name);
}
function planImport(rows){
  const map=new Map(),idents=[];
  for(const r of rows){
    const key=r.id?'id:'+r.id:(r.set&&r.cn)?'sc:'+r.set+'/'+r.cn:'n:'+r.name.toLowerCase();
    let e=map.get(key);
    if(!e){e={qty:0,foil:0,used:false,ident:r.id?{id:r.id}:(r.set&&r.cn)?{set:r.set,collector_number:r.cn}:{name:r.name}};map.set(key,e);idents.push(e.ident);}
    if(r.foil) e.foil+=r.qty; else e.qty+=r.qty;
  }
  return {map,idents};
}
function cardKeys(c){return ['id:'+c.id,'sc:'+c.set+'/'+c.collector_number,'n:'+String(c.name).toLowerCase()];}
function parseDecklist(text){
  const out=[];let board='main';
  for(const raw of text.split(/\r?\n/)){
    let line=raw.trim(); if(!line||line.startsWith('//')||line.startsWith('#')) continue;
    const hm=line.match(/^\[(.+)\]$/);
    if(hm){const n=hm[1].trim().toLowerCase();board=(n==='commander'||n==='commanders')?'commander':n==='sideboard'?'side':(n==='maybeboard'||n==='considering')?'skip':'main';continue;}
    const h=line.replace(/:$/,'').toLowerCase();
    if(h==='sideboard'||h==='sb'){board='side';continue;}
    if(h==='commander'||h==='commanders'){board='commander';continue;}
    if(h==='deck'||h==='main'||h==='mainboard'){board='main';continue;}
    if(h==='maybeboard'||h==='considering'){board='skip';continue;}
    let b=board; if(/^sb:\s*/i.test(line)){line=line.replace(/^sb:\s*/i,'');b='side';}
    if(b==='skip') continue;
    const m=line.match(/^(\d+)\s*x?\s+(.+?)(?:\s+\(([A-Za-z0-9]{2,6})\)(?:\s+([\w\-★]+))?)?\s*(?:\*[A-Za-z]+\*)?$/);
    if(!m) continue;
    out.push({qty:+m[1],name:m[2].trim(),set:m[3]?m[3].toLowerCase():'',cn:m[4]||'',board:b});
  }
  return out;
}
/*PURE-END*/

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- storage ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('pocket-binder',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('cards',{keyPath:'id'});d.createObjectStore('collection',{keyPath:'id'});d.createObjectStore('decks',{keyPath:'id'});d.createObjectStore('meta');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const idb={
  all:s=>new Promise((res,rej)=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}),
  get:(s,k)=>new Promise((res,rej)=>{const q=db.transaction(s).objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}),
  put:(s,v,k)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');k===undefined?t.objectStore(s).put(v):t.objectStore(s).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}),
  putMany:(s,vs)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');const o=t.objectStore(s);vs.forEach(v=>o.put(v));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}),
  del:(s,k)=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}),
  clear:s=>new Promise((res,rej)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=()=>res();t.onerror=()=>rej(t.error);})
};

const S={cards:new Map(),coll:new Map(),decks:[],lastRefresh:0,tab:'search',deckId:null,target:null,busy:false,collQ:'',collSort:'name',collLimit:100,
  search:{q:'',prints:false,results:[],next:null,total:0,loading:false,err:'',empty:false,seq:0}};

/* ---------- cards & prices ---------- */
function faceImg(c,k){const u=c.image_uris||(c.card_faces&&c.card_faces[0]&&c.card_faces[0].image_uris)||{};return u[k]||'';}
function slim(c){
  const f=c.card_faces||[];const p=c.prices||{};
  return {id:c.id,name:c.name,set:c.set,set_name:c.set_name,cn:c.collector_number,rarity:c.rarity,
    mana:c.mana_cost||f.map(x=>x.mana_cost).filter(Boolean).join(' // '),cmc:c.cmc||0,type:c.type_line||'',
    text:c.oracle_text||f.map(x=>x.oracle_text).filter(Boolean).join('\n//\n'),
    img:faceImg(c,'small'),imgL:faceImg(c,'normal'),
    prices:{usd:p.usd,usd_foil:p.usd_foil,usd_etched:p.usd_etched},uri:c.scryfall_uri,upd:Date.now()};
}
function remember(list,persist){const s=list.map(slim);s.forEach(c=>S.cards.set(c.id,c));if(persist)idb.putMany('cards',s);return s;}
const num=v=>v==null||v===''?null:parseFloat(v);
function unitPrice(c,foil){const p=c.prices||{};return foil?(num(p.usd_foil)??num(p.usd_etched)??num(p.usd)):(num(p.usd)??num(p.usd_foil)??num(p.usd_etched));}
const money=n=>n==null?'—':'$'+n.toFixed(2);
function entryValue(e){const c=S.cards.get(e.id);if(!c)return 0;return (e.qty||0)*(unitPrice(c,false)||0)+(e.foil||0)*(unitPrice(c,true)||0);}
const owned=id=>{const e=S.coll.get(id);return e?(e.qty||0)+(e.foil||0):0;};
function ownedByName(){const m=new Map();for(const e of S.coll.values()){const c=S.cards.get(e.id);if(c)m.set(c.name,(m.get(c.name)||0)+e.qty+e.foil);}return m;}

/* ---------- Scryfall ---------- */
let lastCall=0;
async function sf(path,opt={}){
  const wait=Math.max(0,lastCall+110-Date.now());lastCall=Date.now()+wait;if(wait)await sleep(wait);
  const url=path.startsWith('http')?path:'https://api.scryfall.com'+path;
  const headers={Accept:'application/json;q=0.9,*/*;q=0.8'};if(opt.body)headers['Content-Type']='application/json';
  for(let i=0;i<2;i++){
    const r=await fetch(url,{...opt,headers});
    if(r.status===429&&i===0){await sleep(2500);continue;}
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const e=new Error(j.details||('Scryfall error '+r.status));e.status=r.status;throw e;}
    return j;
  }
}
async function fetchCollection(idents,onProgress){
  const found=[],missing=[];
  for(let i=0;i<idents.length;i+=75){
    const j=await sf('/cards/collection',{method:'POST',body:JSON.stringify({identifiers:idents.slice(i,i+75)})});
    found.push(...j.data);missing.push(...(j.not_found||[]));
    if(onProgress)onProgress(Math.min(i+75,idents.length),idents.length);
  }
  return {found,missing};
}
function setStatus(t){$('#status').textContent=t||statusIdle();}
function statusIdle(){
  if(!S.lastRefresh)return 'Prices not yet updated';
  const h=Math.round((Date.now()-S.lastRefresh)/36e5);
  return 'Prices updated '+(h<1?'just now':h<48?h+'h ago':Math.round(h/24)+'d ago');
}
async function refreshAll(auto){
  if(S.busy)return;
  const ids=[...new Set([...S.coll.keys(),...S.decks.flatMap(d=>d.cards.map(c=>c.id))])];
  if(!ids.length){if(!auto)toast('Nothing to update yet');return;}
  S.busy=true;
  try{
    const {found}=await fetchCollection(ids.map(id=>({id})),(a,b)=>setStatus('Updating '+a+' of '+b+'…'));
    remember(found,true);
    S.lastRefresh=Date.now();await idb.put('meta',S.lastRefresh,'lastRefresh');
    if(!auto)toast('Updated '+found.length+' cards');
  }catch(e){if(!auto)toast('Could not reach Scryfall. Try again online.');}
  finally{S.busy=false;setStatus();refreshView();}
}

/* ---------- mutations ---------- */
function persistCard(id){const c=S.cards.get(id);if(c)idb.put('cards',c);}
function collAdd(id,foil,delta){
  const e=S.coll.get(id)||{id,qty:0,foil:0};
  if(foil)e.foil=Math.max(0,e.foil+delta);else e.qty=Math.max(0,e.qty+delta);
  if(e.qty+e.foil===0){S.coll.delete(id);idb.del('collection',id);}else{S.coll.set(id,e);idb.put('collection',e);persistCard(id);}
}
const saveDeck=d=>idb.put('decks',d);
function deckAdd(d,id,board,delta){
  let e=d.cards.find(x=>x.id===id&&x.board===board);
  if(!e){if(delta<=0)return;e={id,qty:0,board};d.cards.push(e);}
  e.qty+=delta;if(e.qty<=0)d.cards=d.cards.filter(x=>x!==e);
  persistCard(id);saveDeck(d);
}
const deckById=id=>S.decks.find(d=>d.id===id);

/* ---------- ui helpers ---------- */
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200);}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
function img(c,k){const u=k==='L'?c.imgL:c.img;return u?`<img src="${esc(u)}" alt="" loading="lazy">`:'<img alt="">';}

/* ---------- views ---------- */
function setTab(t){S.tab=t;S.deckId=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();scrollTo(0,0);}
function render(){({search:renderSearch,coll:renderColl,decks:renderDecks,sync:renderSync})[S.tab]();}
function refreshView(){const t=S.tab;if(t==='search')renderResults();else if(t==='coll')renderCollList();else if(t==='decks')renderDecks();else renderSync();}

/* search */
function renderSearch(){
  const s=S.search,d=S.target&&deckById(S.target);
  $('#view').innerHTML=`
    ${d?`<div class="banner"><span>Adding to <b>${esc(d.name)}</b></span><button class="btn small" data-a="opendeck" data-id="${d.id}">Open deck</button><button class="btn small" data-a="cleartarget">Done</button></div>`:''}
    <div class="bar"><input id="q" type="search" placeholder="Search cards, e.g. t:goblin c:r cmc<=2" enterkeyhint="search" autocomplete="off" value="${esc(s.q)}"></div>
    <div class="bar"><button class="chip" data-a="prints" aria-pressed="${s.prints}">All printings</button><span class="sub">Scryfall syntax works here</span></div>
    <div id="results"></div>`;
  renderResults();
}
function renderResults(){
  const el=$('#results');if(!el)return;const s=S.search;
  if(s.err){el.innerHTML=`<p class="err">${esc(s.err)}</p>`;return;}
  if(!s.results.length){el.innerHTML=s.loading?'<p class="empty">Searching…</p>':s.empty?'<p class="empty">No cards matched that search.</p>':'<p class="empty">Search by name or use Scryfall syntax.<br>Tap + on a card to add it fast, or tap the card for details.</p>';return;}
  const quickLabel=S.target?'Add to deck':'Add to collection';
  el.innerHTML=`<p class="sub">${s.total} card${s.total===1?'':'s'} found</p><div class="grid">`+s.results.map(c=>{
    const n=owned(c.id);
    return `<div class="tile"><button class="tile" data-a="card" data-id="${c.id}" style="display:block;width:100%">${img(c)}<div class="t"><b>${esc(c.name)}</b><span class="sub">${esc(c.set.toUpperCase())} #${esc(c.cn)} · ${money(unitPrice(c,false))}</span></div></button>${n?`<span class="own">${n}</span>`:''}<button class="add" data-a="quick" data-id="${c.id}" aria-label="${quickLabel}: ${esc(c.name)}">+</button></div>`;
  }).join('')+'</div>'+(s.next?`<div class="bar"><button class="btn" data-a="more" ${s.loading?'disabled':''}>${s.loading?'Loading…':'Load more'}</button></div>`:'');
}
async function runSearch(more){
  const s=S.search,q=s.q.trim();if(!more&&!q){s.results=[];s.empty=false;s.err='';renderResults();return;}
  const seq=++s.seq;s.loading=true;s.err='';s.empty=false;renderResults();
  try{
    const j=more?await sf(s.next):await sf(`/cards/search?q=${encodeURIComponent(q)}&unique=${s.prints?'prints':'cards'}&order=name`);
    if(seq!==s.seq)return;
    const cs=remember(j.data,false);
    s.results=more?s.results.concat(cs):cs;s.total=j.total_cards||s.results.length;s.next=j.has_more?j.next_page:null;
  }catch(e){
    if(seq!==s.seq)return;
    if(e.status===404){if(!more){s.results=[];s.total=0;s.next=null;}s.empty=!more;}
    else s.err=navigator.onLine?e.message:'No connection. Search needs the internet; your collection and decks still work offline.';
  }finally{if(seq===s.seq){s.loading=false;renderResults();}}
}

const FORMATS=['Commander','Standard','Modern','Pioneer','Legacy','Pauper','Limited','Other'];
function renderDecks(){S.deckId&&deckById(S.deckId)?renderDeck():renderDeckList();}
function deckStats(d){let n=0,val=0;for(const e of d.cards){n+=e.qty;const c=S.cards.get(e.id);if(c)val+=e.qty*(unitPrice(c,false)||0);}return {n,val};}
function renderDeckList(){
  S.deckId=null;
  $('#view').innerHTML=`

}
const TYPES=['Creature','Planeswalker','Battle','Instant','Sorcery','Artifact','Enchantment','Land'];
function typeGroup(t){if(/Land/.test(t))return 'Land';return TYPES.find(x=>t.includes(x))||'Other';}
function renderDeck(){
  const d=deckById(S.deckId);if(!d){renderDeckList();return;}
  const own=ownedByName(),boards={commander:[],main:[],side:[]};
  for(const e of d.cards){const c=S.cards.get(e.id);if(c)(boards[e.board]||boards.main).push({e,c});}
  const st=deckStats(d);
  const need=new Map();for(const e of d.cards){const c=S.cards.get(e.id);if(c&&e.board!=='side')need.set(c.name,(need.get(c.name)||0)+e.qty);}
  let missing=0;for(const [n,q] of need)missing+=Math.max(0,q-(own.get(n)||0));
  const curve=Array(8).fill(0);for(const x of [...boards.commander,...boards.main])if(typeGroup(x.c.type)!=='Land')curve[Math.min(7,Math.floor(x.c.cmc))]+=x.e.qty;
  const mx=Math.max(1,...curve);
  const sect=(title,list)=>{if(!list.length)return '';
    const groups={};list.forEach(x=>{(groups[typeGroup(x.c.type)]??=[]).push(x);});
    const order=[...TYPES,'Other'].filter(t=>groups[t]);
    return `<h3>${title} · ${list.reduce((a,x)=>a+x.e.qty,0)}</h3>`+order.map(t=>`<p class="sub" style="margin:10px 0 0">${t} · ${groups[t].reduce((a,x)=>a+x.e.qty,0)}</p>`+
      groups[t].sort((a,b)=>a.c.cmc-b.c.cmc||a.c.name.localeCompare(b.c.name)).map(({e,c})=>{
        const have=own.get(c.name)||0,lack=e.board==='side'?0:Math.max(0,(need.get(c.name)||0)-have);
        return `<div class="row" data-a="card" data-id="${c.id}" data-board="${e.board}">${img(c)}<div class="rmain"><b>${esc(c.name)}</b><span class="sub">${esc(c.mana||c.type)}${lack?` · <span class="need">need ${lack} more</span>`:''}</span></div><div class="qty" data-stop><button data-a="ddec" data-id="${c.id}" data-board="${e.board}" aria-label="Remove one">−</button><span>${e.qty}</span><button data-a="dinc" data-id="${c.id}" data-board="${e.board}" aria-label="Add one">+</button></div></div>`;}).join('')).join('');};
  $('#view').innerHTML=`
    <div class="bar"><button class="btn small" data-a="back">‹ Decks</button></div>
    <h2 style="margin-top:4px">${esc(d.name)}</h2><p class="sub">${esc(d.format)}</p>
    <div class="stats"><div><b>${st.n}</b><span>Cards</span></div><div><b>${money(st.val)}</b><span>Value</span></div><div><b>${missing}</b><span>Not owned</span></div></div>
    <div class="bar"><button class="btn primary small" data-a="adddeck">Add cards</button><button class="btn small" data-a="importdeck">Import list</button><button class="btn small" data-a="copydeck">Copy list</button><button class="btn small" data-a="renamedeck">Rename</button><button class="btn small danger" data-a="deletedeck">Delete</button></div>
    ${st.n?`<h3>Mana curve (no lands)</h3><div class="curve">${curve.map((n,i)=>`<div><i style="height:${Math.round(n/mx*64)}px"></i>${n||''}<span>${i===7?'7+':i}</span></div>`).join('')}</div>`:'<p class="empty">This deck is empty. Tap Add cards or import a list.</p>'}
    ${sect('Commander',boards.commander)}${sect('Main deck',boards.main)}${sect('Sideboard',boards.side)}`;
}
function deckText(d){
  const line=e=>{const c=S.cards.get(e.id);return c?`${e.qty} ${c.name} (${c.set.toUpperCase()}) ${c.cn}`:null;};
  const part=b=>d.cards.filter(e=>e.board===b).map(line).filter(Boolean);
  const out=[];const cm=part('commander');if(cm.length)out.push('Commander',...cm,'');out.push(...part('main'));const sb=part('side');if(sb.length)out.push('','Sideboard',...sb);
  return out.join('\n');
}

async function importCSV(file){
  if(S.busy)return;S.busy=true;
  try{
    const rows=csvToRows(await file.text());if(!rows.length){toast('No cards found in that file');return;}
    const {map,idents}=planImport(rows);
    const {found,missing}=await fetchCollection(idents,(a,b)=>setStatus('Importing '+a+' of '+b+'…'));
    remember(found,true);
    if($('#impmode')&&$('#impmode').value==='replace'){S.coll.clear();await idb.clear('collection');}
    let added=0;
    for(const c of found){const k=cardKeys(c).find(k=>map.has(k)&&!map.get(k).used);if(!k)continue;const x=map.get(k);x.used=true;
      const e=S.coll.get(c.id)||{id:c.id,qty:0,foil:0};e.qty+=x.qty;e.foil+=x.foil;S.coll.set(c.id,e);added+=x.qty+x.foil;}
    await idb.putMany('collection',[...S.coll.values()]);
    toast(`Imported ${added} cards`+(missing.length?` · ${missing.length} not found`:''));
  }catch(e){toast('Import failed: '+(navigator.onLine?e.message:'no connection'));}
  finally{S.busy=false;setStatus();renderSync();}
}
function exportCSV(){
  const rows=[['Name','Set code','Set name','Collector number','Foil','Rarity','Quantity','Scryfall ID']];
  for(const e of S.coll.values()){const c=S.cards.get(e.id);if(!c)continue;
    if(e.qty)rows.push([c.name,c.set,c.set_name,c.cn,'normal',c.rarity,e.qty,c.id]);
    if(e.foil)rows.push([c.name,c.set,c.set_name,c.cn,'foil',c.rarity,e.foil,c.id]);}
  download('collection.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');
}
function exportJSON(){download('pocket-binder-backup.json',JSON.stringify({v:1,coll:[...S.coll.values()],decks:S.decks,cards:[...S.cards.values()].filter(c=>S.coll.has(c.id)||S.decks.some(d=>d.cards.some(e=>e.id===c.id)))}),'application/json');}
async function restoreJSON(file){
  try{
    const j=JSON.parse(await file.text());if(!j||j.v!==1)throw new Error('Not a Pocket Binder backup');
    await Promise.all(['cards','collection','decks'].map(s=>idb.clear(s)));
    await idb.putMany('cards',j.cards||[]);await idb.putMany('collection',j.coll||[]);await idb.putMany('decks',j.decks||[]);
    await load();toast('Backup restored');renderSync();
  }catch(e){toast('Could not restore: '+e.message);}
}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const nav=ev.target.closest('nav button');if(nav){setTab(nav.dataset.tab);return;}
  if(ev.target===$('#dlg')){$('#dlg').close();return;}
  const el=ev.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id;
  switch(a){
    case 'card':if(ev.target.closest('[data-stop]'))return;openCard(id,el.dataset.board);break;
    case 'close':$('#dlg').close();break;
    case 'prints':S.search.prints=!S.search.prints;el.setAttribute('aria-pressed',S.search.prints);runSearch();break;
    case 'more':runSearch(true);break;
    case 'quick':{const d=S.target&&deckById(S.target);persistCard(id);
      if(d){deckAdd(d,id,'main',1);toast('Added to '+d.name);}else{collAdd(id,false,1);toast('Added to collection');}renderResults();break;}
    case 'inc':collAdd(id,false,1);renderCollList();break;
    case 'dec':{const e=S.coll.get(id);if(e){if(e.qty>0)collAdd(id,false,-1);else collAdd(id,true,-1);}renderCollList();break;}
    case 'showmore':S.collLimit+=100;renderCollList();break;
    case 'sinc':collAdd(sheetId,el.dataset.foil==='1',+el.dataset.d);renderSheet();refreshView();break;
    case 'sdeckadd':{const d=deckById($('#sdeck').value);sheetBoard=$('#sboard').value;if(d){deckAdd(d,sheetId,sheetBoard,1);toast('Added to '+d.name);refreshView();}break;}
    case 'prints2':{$('#dlg').close();S.search.q='!"'+el.dataset.name+'"';S.search.prints=true;setTab('search');runSearch();break;}
    case 'deck':S.deckId=id;renderDeck();scrollTo(0,0);break;
    case 'opendeck':S.deckId=id;S.tab='decks';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==='decks'));renderDeck();break;
    case 'back':S.deckId=null;renderDeckList();break;
    case 'cleartarget':S.target=null;renderSearch();break;
    case 'adddeck':S.target=S.deckId;setTab('search');break;
    case 'dinc':deckAdd(deckById(S.deckId),id,el.dataset.board,1);renderDeck();break;
    case 'ddec':deckAdd(deckById(S.deckId),id,el.dataset.board,-1);renderDeck();break;
    case 'copydeck':{const t=deckText(deckById(S.deckId));try{await navigator.clipboard.writeText(t);toast('Deck list copied');}catch{download('deck.txt',t,'text/plain');}break;}
    case 'renamedeck':{const d=deckById(S.deckId);const n=prompt('Deck name',d.name);if(n&&n.trim()){d.name=n.trim().slice(0,60);d.updated=Date.now();saveDeck(d);renderDeck();}break;}
    case 'deletedeck':{const d=deckById(S.deckId);if(confirm('Delete "'+d.name+'"? Your collection is not affected.')){S.decks=S.decks.filter(x=>x!==d);idb.del('decks',d.id);S.target=S.target===d.id?null:S.target;renderDeckList();}break;}
    case 'importdeck':openImportDeck();break;
    case 'doimport':doImportDeck();break;
    case 'refresh':refreshAll(false);renderSync();break;
    case 'exportcsv':exportCSV();break;
    case 'exportjson':exportJSON();break;

  $('#dlg').innerHTML=`<div class="sheet"><h2>Import deck list</h2><p class="sub">Paste a list like “4 Lightning Bolt” or “1 Sol Ring (CMM) 400”. Lines under “Sideboard” or “Commander” go to that section.</p>

async function doImportDeck(){
  const d=deckById(S.deckId),list=parseDecklist($('#dtext').value);if(!list.length){$('#impmsg').textContent='No card lines found.';return;}
  $('#impmsg').textContent='Looking up cards…';
  try{
    const seen=new Map();list.forEach(x=>{const k=x.set&&x.cn?'sc:'+x.set+'/'+x.cn:'n:'+x.name.toLowerCase();if(!seen.has(k))seen.set(k,x.set&&x.cn?{set:x.set,collector_number:x.cn}:{name:x.name});});
    const {found}=await fetchCollection([...seen.values()],(a,b)=>{$('#impmsg').textContent='Looking up cards '+a+' of '+b+'…';});
    remember(found,true);
    const by=new Map();found.forEach(c=>cardKeys(c).forEach(k=>{if(!by.has(k))by.set(k,c);}));
    let ok=0;const miss=[];
    for(const x of list){const c=(x.set&&x.cn&&by.get('sc:'+x.set+'/'+x.cn))||by.get('n:'+x.name.toLowerCase())||[...by.values()].find(v=>v.name.toLowerCase().startsWith(x.name.toLowerCase()+' //'));
      if(c){deckAdd(d,c.id,x.board,x.qty);ok+=x.qty;}else miss.push(x.name);}
    d.updated=Date.now();saveDeck(d);$('#dlg').close();renderDeck();
    toast(`Imported ${ok} cards`+(miss.length?` · not found: ${miss.slice(0,3).join(', ')}${miss.length>3?'…':''}`:''));
  }catch(e){$('#impmsg').textContent='Import failed: '+(navigator.onLine?e.message:'no connection');}
}

  S.cards=new Map(cards.map(c=>[c.id,c]));S.coll=new Map(coll.map(e=>[e.id,e]));S.decks=decks;S.lastRefresh=lr||0;
}
(async function boot(){
  try{
    db=await openDB();await load();
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){$('#view').innerHTML='<p class="err">This browser blocked on-device storage, so nothing can be saved. Try opening the app in Chrome outside private mode.</p>';return;}
  setStatus();render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.onLine&&Date.now()-S.lastRefresh>864e5)refreshAll(true);
  addEventListener('online',()=>{if(Date.now()-S.lastRefresh>864e5)refreshAll(true);});
})();
</script>
